function theilSenSlope(pts) {
  const slopes = [];
  for (let i = 0; i < pts.length; i++) {
    for (let j = i + 1; j < pts.length; j++) {
      const dt = pts[j].t - pts[i].t;
      if (dt !== 0) slopes.push((pts[j].w - pts[i].w) / dt);
    }
  }
  if (!slopes.length) return null;
  slopes.sort((a, b) => a - b);
  const m = Math.floor(slopes.length / 2);
  return slopes.length % 2 ? slopes[m] : (slopes[m - 1] + slopes[m]) / 2;
}

// Volume-load (tonnage) for a set array: sum of weight x reps, in kg.
// A supporting metric only — e1RM and hitting rep targets at RIR are the primary
// hypertrophy signals. Tonnage can rise on lighter/higher-rep work, so read it as
// "total work done", not "did I get stronger".
const volLoad = (sets) => (sets || []).reduce((a, s) => a + ((+s.weight || 0) * (+s.reps || 0)), 0);
const sessionVol = (log) => (log && log.exercises ? log.exercises.reduce((a, e) => a + volLoad(e.sets), 0) : 0);

// Strict numeric parser for user input at write boundaries.
// Returns a finite number, or null if the input is empty/blank/non-numeric/non-finite.
// Guards against: "." "-" "  " "1.2.3" "Infinity" "5e" and comma-decimal locales ("5,5").
// Returns null (not 0) so callers reject the entry rather than silently store a wrong value.
const parseNum = (raw) => {
  if (raw == null) return null;
  const s = String(raw).trim().replace(',', '.');
  if (s === '') return null;
  const n = Number(s);              // Number() is stricter than parseFloat: "1.2.3"->NaN, "5-"->NaN
  return Number.isFinite(n) ? n : null;
};
const localToday = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
const RAMP_EX = new Set(['ua3','ua4','ua5','ub3','ub4','ub5']);   // accessories only — ub1 (weighted pull-up) removed: ramping a heavy compound contradicts the ramp's purpose and stacks elbow/biceps tendon load
const RAMP_P1 = new Set([2,6]);
const RAMP_P2 = new Set([3,7]);
const HIGHVOL_EX = new Set(['ua5','ub4','ua8','ub5','ub7','ua6','ub8','la6','lb5','la7','lb7','ua7','lb6']);
const getEffSets = (ex, week, hv, dl = (_deloadNow == null ? DLW.has(week) : _deloadNow)) => {
  let s = ex.sets;
  // floor, not round: rounding 3->2 and 5->3 made the advertised 50% deload land nearer 60%.
  if (dl) return Math.max(1, Math.floor(s * 0.5));
  if (hv && HIGHVOL_EX.has(ex.id)) s += 1;
  if (RAMP_EX.has(ex.id)) { if (RAMP_P2.has(week)) s += 2; else if (RAMP_P1.has(week)) s += 1; }
  return s;
};


function calcPlates(target, bar=20) {
  const avail = [25,20,15,10,5,2.5,1.25];
  const perSide = (target - bar) / 2;
  if (perSide < 0) return {ok:false, plates:[]};
  let rem = perSide; const plates = [];
  for (const p of avail) { const n=Math.floor(rem/p+0.001); if(n>0){plates.push({kg:p,count:n});rem-=n*p;} }
  return {ok:rem<0.1, plates};
}

function calcWarmups(working) {
  if (!working || working <= 20) return [];
  const res = [{wt:20,reps:10,pct:"Bar"}];
  const pcts = working<=60?[0.5,0.75]:working<=100?[0.5,0.65,0.8]:[0.4,0.55,0.7,0.85];
  for (const p of pcts) { const w=Math.round(working*p/2.5)*2.5; res.push({wt:w,reps:p>=0.8?1:p>=0.65?2:4,pct:`${Math.round(p*100)}%`}); }
  return res;
}

// Substituted exercises are logged under a generated id (sub_<baseId>_<name>) which is NOT
// in EX_MUSCLE. Without falling back to origId, every set done on a swapped exercise
// contributed ZERO to volume, heat map, autoregulation and plateau detection.
function exMuscle(ex) { return EX_MUSCLE[ex.origId || ex.id] || EX_MUSCLE[ex.id]; }
function weekMuscleVolume(logs, wk, block) {
  const v = {};
  for (const l of logs) {
    if (l.week !== wk) continue;
    if (block != null && (l.block||1) !== block) continue;
    for (const ex of (l.exercises || [])) {
      const m = exMuscle(ex); if (!m) continue;
      const sets = ex.sets?.length || 0;
      v[m.p] = (v[m.p] || 0) + sets;
      if (m.s) { const ss=Array.isArray(m.s)?m.s:[m.s]; for(const sm of ss) v[sm]=(v[sm]||0)+sets*0.5; }
    }
  }
  return v;
}
function weeklyVolumeSeries(logs, muscle, block) {
  const byWeek = {};
  for (const l of logs) {
    if (block != null && (l.block||1) !== block) continue;
    for (const ex of (l.exercises || [])) {
      const m = exMuscle(ex); if (!m) continue;
      const sets = ex.sets?.length || 0;
      if (muscle === 'all') { byWeek[l.week] = (byWeek[l.week] || 0) + sets; }
      else { let add = 0; if (m.p === muscle) add += sets; if (m.s) { const ss=Array.isArray(m.s)?m.s:[m.s]; if(ss.includes(muscle)) add += sets * 0.5; } if (add) byWeek[l.week] = (byWeek[l.week] || 0) + add; }
    }
  }
  const weeks = Object.keys(byWeek).map(Number).sort((a,b) => a-b);
  return weeks.map(w => ({ x: 'W' + w, y: Math.round(byWeek[w] * 10) / 10 }));
}

// Accepts either the exercise OBJECT (preferred — carries setPlan) or a bare rMax number
// (backward compatible). Two corrections vs the old version:
//  C1: deload sessions are skipped, so the week after a deload does not learn its ~85% loads
//      as the new working weight (mirrors computeStalls / computeActualVolume).
//  C2: top-set/back-off lifts are judged PER SLOT against each slot's own rMax. With a single
//      envelope rMax, a correctly capped top set (e.g. 6-8 under an envelope of 10) could never
//      satisfy "every set hit rMax", so the engine only rewarded breaking the prescription.
function getProgRec(exId, exOrRMax, logs, phase) {
  const isObj = exOrRMax && typeof exOrRMax === 'object';
  const rMax = isObj ? exOrRMax.rMax : exOrRMax;
  const setPlan = isObj ? exOrRMax.setPlan : null;
  // Expand setPlan into a per-set cap array; extra logged sets (e.g. HV +1) inherit the last cap.
  const capsFor = (nSets) => {
    if (!setPlan || !setPlan.length) return null;
    const caps = [];
    for (const sp of setPlan) for (let i = 0; i < sp.sets; i++) caps.push(sp.rMax);
    while (caps.length < nSets) caps.push(caps.length ? caps[caps.length - 1] : rMax);
    return caps;
  };
  // Collect the recent eligible (non-deload) sessions rather than only the newest. One bad day
  // used to freeze you on "beat that" until you beat it, even if the session before was a clean
  // sweep at the SAME load. We scan the last N and treat progression as earned if any of them
  // swept every slot AT THE CURRENT LOAD. Matching on the same load matters: if you have
  // deliberately dropped weight (or just moved up), that is a new working load and an older
  // sweep at a different load must not carry over.
  const N = 3;
  const recent = [];
  for (const s of logs) {
    if (s.deload === true) continue;                       // C1
    if (s.deload == null && DLW.has(s.week)) continue;     // C1 (flag missing on older logs)
    const ex = s.exercises?.find(e => e.id === exId);
    if (!ex?.sets?.length) continue;
    const top = Math.max(...ex.sets.map(x => x.weight));
    const caps = capsFor(ex.sets.length);
    const hit = caps ? ex.sets.map((x, i) => x.reps >= caps[i]) : ex.sets.map(x => x.reps >= rMax);
    recent.push({ top, hit, all: hit.every(Boolean), some: hit.some(Boolean) });
    if (recent.length >= N) break;
  }
  if (recent.length) {
    const cur = recent[0];
    const earned = recent.find(r => r.all && r.top === cur.top);   // same load; newest counts too
    if (earned) {
      // Cut progresses on PERFORMANCE (all slots capped), never on a readiness reading. It fires
      // rarely on a deficit, which is the intended "take it when the reps are there" behaviour.
      return phase === 'cut'
        ? { type: "inc", msg: "All slots hit their cap — take the load if it's there", wt: earned.top }
        : { type: "inc", msg: "All slots hit their rep cap — increase weight", wt: earned.top };
    }
    if (cur.some) return { type: "beat", msg: "Beat the slots that fell short, keep weight", wt: cur.top };
    return { type: "keep", msg: "Keep weight, beat reps", wt: cur.top };
  }
  return { type: "first", msg: "First time — establish your working weight" };
}

function getPrevHist(exId, logs, limit=3, exactOnly=false) {
  const res = [];
  for (const s of logs) {
    // C1: skip deload sessions. getTarget reads getPrevHist(...,1)[0] as "last working set",
    // so including a deload made the week after a deload prescribe ~85% loads as the new baseline.
    if (s.deload === true) continue;
    if (s.deload == null && DLW.has(s.week)) continue;
    // exactOnly (progression): match ONLY this exact stream. The default (display) also matches a
    // lift swapped FROM this ID (origId) so the "previous sessions" list has no blind spot — but
    // that must NOT feed progression: a 60 kg substitute logged under origId would otherwise
    // become the baseline for the 100 kg base lift and prescribe ~62.5 kg on return (PROG-02).
    const ex = exactOnly
      ? s.exercises?.find(e => e.id === exId)
      : s.exercises?.find(e => e.id === exId || e.origId === exId);
    if (ex?.sets?.length) { res.push({date:s.date, sets:ex.sets, week:s.week, swapped: ex.id!==exId ? ex.name : null}); if(res.length>=limit) break; }
  }
  return res;
}

function getIncrement(ex) {
  const n = (ex.name || '').toLowerCase();
  if (n.includes('pull-up') || n.includes('chin')) return 1.25;
  if (n.includes('db ') || n.includes('dumbbell')) return 2;
  if (/(lateral|fly|crunch|curl|ext|raise|face pull|adductor|pulldown|cross)/.test(n)) return 1;
  return 2.5;
}
function getTarget(ex, logs, week, phase, histId, dl = (_deloadNow == null ? DLW.has(week) : _deloadNow)) {
  // histId lets a substituted exercise read its own logged history. Without it, a swap
  // inherited the base exercise's loads (e.g. machine press targeted at RO-T8 weights).
  const _hid = histId || ex.id;
  // Exact-stream match here (not id||origId): getProgRec already matches exact id, so prev must
  // too — otherwise a substitute logged under origId sets topWeight while the base's own session
  // drives the verdict, prescribing e.g. 62.5 kg on returning to a 100 kg lift (PROG-02).
  const prev = getPrevHist(_hid, logs, 1, true)[0];
  if (!prev) return { weight: 0, reps: ex.rMin, note: 'First time — establish a working weight', first: true };
  const topWeight = Math.max(...prev.sets.map(s => s.weight));
  const rec = getProgRec(_hid, ex, logs, phase);
  const incr = getIncrement(ex);
  if (dl) {
    return { weight: Math.round((topWeight * 0.85) / 2.5) * 2.5, reps: Math.round((ex.rMin + ex.rMax) / 2), note: 'Deload — keep several reps in reserve' };
  }
  if (phase === 'cut' && rec.type !== 'inc') {
    return { weight: topWeight, reps: ex.rMax, note: 'Cut — hold load, retain muscle' };
  }
  if (rec.type === 'inc') {
    return { weight: topWeight + incr, reps: ex.rMin, note: 'Up ' + incr + 'kg — you hit top reps last time' };
  }
  if (rec.type === 'beat') {
    return { weight: topWeight, reps: ex.rMax, note: 'Same weight — some sets hit target, beat the weaker ones' };
  }
  return { weight: topWeight, reps: ex.rMax, note: 'Same weight — no sets hit target reps yet, keep building' };
}

let _audioCtx = null;
function getAudioCtx() {
  try {
    if (!_audioCtx) _audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (_audioCtx.state === 'suspended') _audioCtx.resume();
    return _audioCtx;
  } catch(e) { return null; }
}
// Call on a user gesture (e.g. starting a set) to unlock audio on iOS.
function primeAudio() {
  const ctx = getAudioCtx();
  if (!ctx) return;
  try {
    const o=ctx.createOscillator(), g=ctx.createGain();
    g.gain.value=0; o.connect(g); g.connect(ctx.destination);
    o.start(); o.stop(ctx.currentTime+0.01);
  } catch(e) {}
}
function vibrate(pattern) {
  try { if (navigator.vibrate) navigator.vibrate(pattern); } catch(e) {}
}
function playChime() {
  // NOTE ON iOS: Web Audio obeys the physical mute switch, and navigator.vibrate is not
  // supported in Safari at all. With the ringer off, neither sound nor haptic can fire —
  // no web app can override that. Hence the louder, longer, repeated pattern below plus a
  // full-screen visual flash, so the end of a rest period is unmissable when audio does work
  // and still obvious when it does not.
  vibrate([200, 100, 200, 100, 400]);
  const ctx = getAudioCtx();
  if (!ctx) return;
  try {
    if (ctx.state === 'suspended') ctx.resume();
    // Three rising triplets over ~1.6s, at roughly double the previous gain.
    const seq = [[880,0],[1100,.15],[1320,.3],
                 [880,.6],[1100,.75],[1320,.9],
                 [880,1.2],[1100,1.35],[1320,1.5]];
    seq.forEach(([freq,delay]) => {
      const o=ctx.createOscillator(), g=ctx.createGain();
      o.connect(g); g.connect(ctx.destination); o.frequency.value=freq; o.type='sine';
      g.gain.setValueAtTime(0, ctx.currentTime+delay);
      g.gain.linearRampToValueAtTime(.34, ctx.currentTime+delay+.04);
      g.gain.exponentialRampToValueAtTime(.001, ctx.currentTime+delay+.45);
      o.start(ctx.currentTime+delay); o.stop(ctx.currentTime+delay+.5);
    });
  } catch(e) {}
}

function RecoveryFuelStrip({ rows, height=150 }) {
  // rows: [{date, recovery, kcal, carbs, sleepH}] oldest->newest
  if (!rows || rows.length < 3) return <div style={{height,display:'flex',alignItems:'center',justifyContent:'center',color:'var(--t3)',fontSize:12,textAlign:'center'}}>Need 3+ days with both WHOOP and logged nutrition to show the overlay</div>;
  const W=Math.max(rows.length*30, 300), barH=height-46, pad=4;
  const kcals=rows.map(r=>r.kcal).filter(v=>v!=null);
  const maxKcal=kcals.length?Math.max(...kcals):1, minKcal=kcals.length?Math.min(...kcals):0;
  const range=Math.max(maxKcal-minKcal,1);
  const colW=(W-pad*2)/rows.length;
  // recovery line points (0-100 mapped to barH)
  const pts=rows.map((r,i)=>{
    const x=pad+colW*i+colW/2;
    const y=r.recovery!=null ? (barH - (r.recovery/100)*barH) : null;
    return {x,y,r};
  });
  const line=pts.filter(p=>p.y!=null).map((p,i)=>`${i===0?'M':'L'}${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');
  const recColor=r=>r>=67?'#00e87a':r>=34?'#f0c020':'#ff6b6b';
  return (
    <div style={{overflowX:'auto'}}>
      <svg width={W} height={height} style={{display:'block'}}>
        {rows.map((r,i)=>{
          const x=pad+colW*i;
          const kh=r.kcal!=null ? Math.max(((r.kcal-minKcal)/range)*(barH*0.7)+6, 6) : 0;
          return (
            <g key={i}>
              {r.kcal!=null && <rect x={x+colW*0.2} y={barH-kh} width={colW*0.6} height={kh} rx={2} fill="rgba(74,158,255,.32)"/>}
              <text x={x+colW/2} y={height-26} fontSize="8" fill="var(--t3)" textAnchor="middle">{r.kcal!=null?Math.round(r.kcal/100)/10+'k':''}</text>
              <text x={x+colW/2} y={height-14} fontSize="8" fill="var(--t3)" textAnchor="middle">{r.date.slice(5)}</text>
              {r.sleepH!=null && <text x={x+colW/2} y={height-2} fontSize="7.5" fill="var(--t3)" textAnchor="middle">{r.sleepH}h</text>}
            </g>
          );
        })}
        {line && <path d={line} fill="none" stroke="#00e87a" strokeWidth="2"/>}
        {pts.filter(p=>p.y!=null).map((p,i)=>(<circle key={i} cx={p.x} cy={p.y} r="3.5" fill={recColor(p.r.recovery)}/>))}
      </svg>
    </div>
  );
}

function Sparkline({ vals, color='#4a9eff', w=54, h=18 }) {
  const nums = (vals||[]).filter(v=>typeof v==='number'&&isFinite(v));
  if (nums.length < 2) return <svg width={w} height={h}/>;
  const min=Math.min(...nums), max=Math.max(...nums), rng=(max-min)||1;
  const pts=nums.map((v,i)=>`${(i/(nums.length-1))*w},${h-((v-min)/rng)*h}`).join(' ');
  return <svg width={w} height={h} style={{display:'block'}}><polyline points={pts} fill="none" stroke={color} strokeWidth="1.5" strokeLinejoin="round" strokeLinecap="round"/></svg>;
}
// Scatter for RELATIONSHIP questions. Bucketed means answer "is A associated with B?" by
// hiding the very thing that decides it: the spread. Three rows of averages look identical
// whether the points are tightly clustered or all over the chart. A scatter shows the
// spread, any single outlier carrying the result, and whether a line through it is honest.
function SVGScatter({ points, color='#c4ff00', height=150, xLabel='', yLabel='', xMin=null, xMax=null, bands=null }) {
  const pts = (points||[]).filter(p => p && Number.isFinite(p.x) && Number.isFinite(p.y));
  if (pts.length < 3) return <div style={{height,display:'flex',alignItems:'center',justifyContent:'center',color:'var(--t3)',fontSize:12}}>Need at least 3 sessions to plot</div>;
  const W = 320, H = height, PX = 30, PY = 14;
  const iW = W - PX*2, iH = H - PY*2;
  const xs = pts.map(p=>p.x), ys = pts.map(p=>p.y);
  const x0 = Number.isFinite(xMin) ? xMin : Math.min(...xs);
  const x1 = Number.isFinite(xMax) ? xMax : Math.max(...xs);
  const xr = (x1 - x0) || 1;
  const yPad = Math.max(2, (Math.max(...ys) - Math.min(...ys)) * 0.15);
  const y0 = Math.min(...ys) - yPad, y1 = Math.max(...ys) + yPad;
  const yr = (y1 - y0) || 1;
  const tx = v => PX + ((v - x0)/xr) * iW;
  const ty = v => PY + iH - ((v - y0)/yr) * iH;
  // Least-squares fit, drawn only with enough points to be worth showing.
  let fit = null;
  if (pts.length >= 6) {
    const n = pts.length;
    const mx = xs.reduce((a,b)=>a+b,0)/n, my = ys.reduce((a,b)=>a+b,0)/n;
    let num=0, den=0;
    for (const p of pts) { num += (p.x-mx)*(p.y-my); den += (p.x-mx)*(p.x-mx); }
    if (den > 0) {
      const m = num/den, c = my - m*mx;
      fit = { x1:tx(x0), y1:ty(m*x0+c), x2:tx(x1), y2:ty(m*x1+c) };
    }
  }
  return (
    <svg viewBox={`0 0 ${W} ${H}`} style={{width:'100%',height:'auto',display:'block'}}>
      {bands && bands.map((b,i) => (
        <rect key={'b'+i} x={tx(Math.max(x0,b.from))} y={PY}
              width={Math.max(1, tx(Math.min(x1,b.to)) - tx(Math.max(x0,b.from)))}
              height={iH} fill={b.color} opacity="0.08"/>
      ))}
      <line x1={PX} y1={ty(0)} x2={W-PX} y2={ty(0)} stroke="var(--bdr)" strokeWidth="1" strokeDasharray="3 3"/>
      <text x={PX-4} y={ty(0)+3} textAnchor="end" fontSize="8" fill="var(--t3)" fontFamily="JetBrains Mono">0%</text>
      {fit && <line x1={fit.x1} y1={fit.y1} x2={fit.x2} y2={fit.y2} stroke={color} strokeWidth="1.5" strokeOpacity="0.55" strokeDasharray="5 4"/>}
      {pts.map((p,i) => (
        <circle key={i} cx={tx(p.x)} cy={ty(p.y)} r="3.5" fill={color} fillOpacity="0.75" stroke={color} strokeWidth="0.5"/>
      ))}
      <text x={PX} y={H-2} fontSize="8" fill="var(--t3)" fontFamily="JetBrains Mono">{Math.round(x0)}</text>
      <text x={W-PX} y={H-2} textAnchor="end" fontSize="8" fill="var(--t3)" fontFamily="JetBrains Mono">{Math.round(x1)}</text>
      <text x={W/2} y={H-2} textAnchor="middle" fontSize="8" fill="var(--t3)" fontFamily="JetBrains Mono">{xLabel}</text>
      <text x={2} y={PY+6} fontSize="8" fill="var(--t3)" fontFamily="JetBrains Mono">{yLabel}</text>
    </svg>
  );
}

// Bars for CATEGORICAL comparison. Session types alternate rather than progress, so a line
// joining them implies a continuity that does not exist: Upper 3 at 72 min followed by Lower
// at 95 min is not a downward trend, it is two different sessions.
function SVGBars({ items, color='#4a9eff', height=130, unit='' }) {
  const rows = (items||[]).filter(i => i && Number.isFinite(i.value));
  if (!rows.length) return <div style={{height,display:'flex',alignItems:'center',justifyContent:'center',color:'var(--t3)',fontSize:12}}>No data yet</div>;
  const W = 320, H = height, PX = 8, PT = 12, PB = 26;
  const iW = W - PX*2, iH = H - PT - PB;
  const max = Math.max(...rows.map(r => Number.isFinite(r.hi) ? r.hi : r.value)) * 1.12 || 1;
  const bw = iW / rows.length;
  return (
    <svg viewBox={`0 0 ${W} ${H}`} style={{width:'100%',height:'auto',display:'block'}}>
      {rows.map((r,i) => {
        const h = Math.max(1, (r.value/max) * iH);
        const x = PX + i*bw + bw*0.18, w = bw*0.64;
        const y = PT + iH - h;
        return (
          <g key={i}>
            {Number.isFinite(r.lo) && Number.isFinite(r.hi) && (
              <line x1={x+w/2} y1={PT+iH-(r.hi/max)*iH} x2={x+w/2} y2={PT+iH-(r.lo/max)*iH}
                    stroke="var(--t3)" strokeWidth="1" opacity="0.7"/>
            )}
            <rect x={x} y={y} width={w} height={h} rx="3" fill={color} fillOpacity="0.85"/>
            <text x={x+w/2} y={y-3} textAnchor="middle" fontSize="9" fill={color} fontFamily="JetBrains Mono" fontWeight="700">{r.value}</text>
            <text x={x+w/2} y={H-14} textAnchor="middle" fontSize="8" fill="var(--t2)">{r.label}</text>
            {r.sub && <text x={x+w/2} y={H-4} textAnchor="middle" fontSize="7.5" fill="var(--t3)" fontFamily="JetBrains Mono">{r.sub}</text>}
          </g>
        );
      })}
      {unit && <text x={W-2} y={PT-3} textAnchor="end" fontSize="8" fill="var(--t3)" fontFamily="JetBrains Mono">{unit}</text>}
    </svg>
  );
}

function SVGChart({ data, color='#c4ff00', height=130, band=null, bandColor='#00e87a', bandLabel=null,
                    trend=false, trendAlpha=0.25, anchor=null, events=null }) {
  // Gradient id derived from the colour. Previously every instance emitted id="cg", so with
  // several charts on one page all area fills resolved to whichever gradient rendered first
  // and charts silently displayed the wrong colour. Deriving from colour is stable across
  // re-renders, and two charts sharing a colour share an identical gradient, so any
  // remaining duplicate is harmless.
  const gid = 'cg' + String(color).replace(/[^a-zA-Z0-9]/g, '');
  // Defense-in-depth: drop any points with non-finite y (NaN/Infinity) before plotting.
  // Protects against legacy localStorage data corrupted before input validation existed,
  // so a single bad value can never produce a broken "M NaN,NaN" path or blank chart.
  data = (data || []).filter(d => d && Number.isFinite(d.y));
  if (!data || data.length < 2) return <div style={{height,display:'flex',alignItems:'center',justifyContent:'center',color:'var(--t3)',fontSize:12}}>Need more sessions to show chart</div>;
  const vals = data.map(d => d.y);
  // A reference band should be visible even when every reading sits outside it, so widen the
  // scale to include the band — otherwise the shading clips to an edge and tells you nothing.
  const hasBand = band && Number.isFinite(band.lo) && Number.isFinite(band.hi) && band.hi > band.lo;
  let maxV = Math.max(...vals, hasBand ? band.hi : -Infinity);
  let minV = Math.min(...vals, hasBand ? band.lo : Infinity);
  // AXIS ANCHORING. Auto-scaling to the data means a 0.4kg water fluctuation fills a third
  // of the chart and reads as a crisis. `anchor` sets a minimum visible span (e.g. 6kg on
  // bodyweight) centred on the data, so ordinary noise looks like ordinary noise. The axis
  // still expands when real movement exceeds the anchor, so nothing is ever clipped.
  if (Number.isFinite(anchor) && anchor > 0) {
    const span = maxV - minV;
    if (span < anchor) {
      const mid = (maxV + minV) / 2;
      maxV = mid + anchor / 2;
      minV = mid - anchor / 2;
    }
  }
  const range = maxV - minV || 1;
  const W=320, H=height, PX=36, PY=14, iW=W-PX*2, iH=H-PY*2;
  // Points were previously spaced purely by index, so a three-day gap between weigh-ins
  // rendered identically to consecutive days and visually distorted the slope. When every
  // point carries a real timestamp (t), space by elapsed time instead. Falls back to even
  // spacing for series that have no dates, so charts without t are unaffected.
  const ts = data.map(d => d.t).filter(v => Number.isFinite(v));
  const timeScaled = ts.length === data.length && data.length > 1;
  const tMin = timeScaled ? Math.min(...ts) : 0;
  const tMax = timeScaled ? Math.max(...ts) : 1;
  const tSpan = tMax - tMin;
  const tx = i => timeScaled && tSpan > 0
    ? PX + ((data[i].t - tMin) / tSpan) * iW
    : PX + (i/(data.length-1))*iW;
  const ty = v => H-PY-((v-minV)/range)*iH;
  const pts = data.map((d,i) => [tx(i), ty(d.y)]);
  // SMOOTHED TREND over raw scatter. A line joining every raw weigh-in makes a water spike
  // look identical to real tissue change - which is exactly how a flat three weeks read as
  // "-1.63 kg/wk". Drawing the raw values as faint dots and the EWMA as the bold line makes
  // the distinction visible without needing a paragraph underneath to explain it.
  // Map events onto the same x scale as the data. Only possible when points carry real
  // timestamps; on index-spaced charts an event has no meaningful position, so it is dropped
  // rather than placed somewhere misleading.
  const annos = [];
  if (events && events.length && timeScaled && tSpan > 0) {
    const xAt = t => PX + ((t - tMin) / tSpan) * iW;
    for (const ev of events) {
      if (!ev || !Number.isFinite(ev.t)) continue;
      if (Number.isFinite(ev.tEnd)) {
        const a = Math.max(tMin, ev.t), b = Math.min(tMax, ev.tEnd);
        if (b < tMin || a > tMax) continue;
        annos.push({ span:true, x1:xAt(a), x2:xAt(b), color:ev.color||'#7b90a8' });
      } else {
        if (ev.t < tMin || ev.t > tMax) continue;
        annos.push({ span:false, x1:xAt(ev.t), color:ev.color||'#7b90a8', label:ev.label||'' });
      }
    }
  }
  let trendPath = null;
  if (trend && data.length >= 4) {
    let e = data[0].y;
    const tp = data.map((d,i) => { e = e + trendAlpha * (d.y - e); return [tx(i), ty(e)]; });
    trendPath = tp.map((p,i) => `${i===0?'M':'L'}${p[0].toFixed(1)} ${p[1].toFixed(1)}`).join(' ');
  }
  const line = pts.map((p,i) => `${i===0?'M':'L'}${p[0].toFixed(1)} ${p[1].toFixed(1)}`).join(' ');
  const area = line + ` L${pts[pts.length-1][0].toFixed(1)} ${H-PY} L${PX} ${H-PY} Z`;
  const yTicks = [0,0.5,1].map(t => ({v: minV+t*range, y: ty(minV+t*range)}));
  const step = Math.ceil(data.length/4);
  const xLabels = data.filter((_,i) => i===0 || i===data.length-1 || i%step===0);
  return (
    <svg viewBox={`0 0 ${W} ${H}`} style={{width:'100%',display:'block'}}>
      <defs>
        <linearGradient id={gid} x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor={color} stopOpacity="0.22"/>
          <stop offset="100%" stopColor={color} stopOpacity="0"/>
        </linearGradient>
      </defs>
      {hasBand && (() => {
        const yHi = ty(band.hi), yLo = ty(band.lo);
        const top = Math.min(yHi, yLo), h = Math.abs(yLo - yHi);
        return (
          <g>
            <rect x={PX} y={top} width={iW} height={h} fill={bandColor} opacity="0.10"/>
            <line x1={PX} y1={top} x2={W-PX} y2={top} stroke={bandColor} strokeWidth="1" strokeDasharray="4 3" opacity="0.45"/>
            <line x1={PX} y1={top+h} x2={W-PX} y2={top+h} stroke={bandColor} strokeWidth="1" strokeDasharray="4 3" opacity="0.45"/>
            {bandLabel && <text x={W-PX-2} y={top-3} textAnchor="end" fontSize="8" fill={bandColor} opacity="0.75" fontFamily="JetBrains Mono">{bandLabel}</text>}
          </g>
        );
      })()}
      {yTicks.map((t,i) => (
        <g key={i}>
          <line x1={PX} y1={t.y} x2={W-PX} y2={t.y} stroke="#1d2733" strokeWidth="1" strokeDasharray="3 3"/>
          <text x={PX-5} y={t.y+3} textAnchor="end" fontSize="9" fill="#3c4f62" fontFamily="JetBrains Mono">{Math.round(t.v)}</text>
        </g>
      ))}
      {xLabels.map((d,i) => {
        const idx = data.indexOf(d);
        return <text key={i} x={tx(idx)} y={H-2} textAnchor="middle" fontSize="9" fill="#3c4f62" fontFamily="JetBrains Mono">{d.x}</text>;
      })}
      {/* EVENT ANNOTATIONS. The app already records deloads, alcohol, illness, travel and
          protocol doses, but none of it reached the charts, so every wobble needed
          interpreting from memory. Markers are positioned on the same time scale as the
          data and drawn beneath it, so they add context without obscuring the line. */}
      {annos.map((a,i) => a.span ? (
        <rect key={'a'+i} x={a.x1} y={PY} width={Math.max(1, a.x2-a.x1)} height={H-PY*2}
              fill={a.color} opacity="0.10"/>
      ) : (
        <g key={'a'+i}>
          <line x1={a.x1} y1={PY} x2={a.x1} y2={H-PY} stroke={a.color} strokeWidth="1"
                strokeDasharray="3 3" opacity="0.5"/>
          <text x={a.x1} y={PY-1} textAnchor="middle" fontSize="7.5" fill={a.color}
                opacity="0.85" fontFamily="JetBrains Mono">{a.label}</text>
        </g>
      ))}
      <path d={area} fill={`url(#${gid})`}/>
      <path d={line} fill="none" stroke={color} strokeWidth={trendPath ? 1 : 2}
            strokeOpacity={trendPath ? 0.28 : 1} strokeLinecap="round" strokeLinejoin="round"/>
      {pts.map((p,i) => <circle key={i} cx={p[0]} cy={p[1]} r={trendPath ? 2 : 3}
                                fill={color} fillOpacity={trendPath ? 0.4 : 1}/>)}
      {trendPath && <path d={trendPath} fill="none" stroke={color} strokeWidth="2.5"
                          strokeLinecap="round" strokeLinejoin="round"/>}
    </svg>
  );
}

// Parse ALL cycle records, keeping only COMPLETED cycles (those with an end timestamp).
// The in-progress cycle's kilojoule field is a running total — reading it mid-morning and
// storing it as the day's expenditure is what produced the systematically-low ~1,500 kcal
// "avg out". A completed cycle carries the true full-day burn.
function parseWhoopCycles(raw) {
  const records = raw?.records || raw?.data || [];
  const localDay = ts => { const d = new Date(ts); return isNaN(d) ? null : `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
  return records.map(c => {
    const s = c.score || c;
    const end = c.end || c.during?.upper || null;
    if (!end) return null;                    // in-progress cycle — never trust its total
    const date = localDay(c.start || c.during?.lower || end);
    if (!date) return null;
    const kcal = s.kilojoule != null ? Math.round(s.kilojoule / 4.184) : null;
    if (kcal == null || kcal <= 0) return null;
    return { date, dayCal: kcal, dayCalFinal: true, strain: s.strain != null ? Math.round(s.strain*10)/10 : null };
  }).filter(Boolean);
}

function parseWhoopHistory(rec) {
  const records = rec?.records || rec?.data || [];
  return records.map(r => {
    const s = r.score || r;
    const date = (r.created_at || r.updated_at || '').slice(0, 10);
    if (!date) return null;
    return {
      date,
      recovery: Math.round(s.recovery_score ?? 0) || null,
      hrv: Math.round(s.hrv_rmssd_milli ?? s.hrv ?? 0) || null,
      rhr: Math.round(s.resting_heart_rate ?? 0) || null,
    };
  }).filter(x => x && x.recovery != null);
}
function mergeHistory(a, b) {
  const map = {};
  // Field-level merge: a later entry must not wipe fields it simply doesn't carry
  // (e.g. parseWhoopHistory has no dayCal; a wholesale replace would erase it).
  [...(a || []), ...(b || [])].forEach(e => {
    if (!e || !e.date) return;
    const prev = map[e.date] || {};
    const merged = { ...prev };
    Object.keys(e).forEach(k => { if (e[k] != null) merged[k] = e[k]; });
    map[e.date] = merged;
  });
  return Object.values(map).sort((x, y) => x.date < y.date ? -1 : 1).slice(-60);
}
function computeDeloadReadiness(history, week) {
  if (!history || history.length < 6) return { level: 'unknown', msg: 'Need about a week of WHOOP data to assess fatigue.' };
  const sorted = [...history].sort((x, y) => x.date < y.date ? -1 : 1);
  const recent = sorted.slice(-7);
  const base = sorted.length >= 14 ? sorted.slice(-14, -7) : sorted.slice(0, -7);
  const avg = (arr, k) => { const v = arr.map(e => e[k]).filter(n => n != null); return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null; };
  const rRec = avg(recent, 'recovery'), bRec = avg(base, 'recovery');
  const rHrv = avg(recent, 'hrv'), bHrv = avg(base, 'hrv');
  let signals = 0; const reasons = [];
  if (rRec != null && bRec != null && (rRec - bRec) <= -8) { signals++; reasons.push('recovery down ' + Math.round(bRec - rRec) + ' pts'); }
  if (rHrv != null && bHrv != null && ((rHrv - bHrv) / bHrv * 100) <= -10) { signals++; reasons.push('HRV down ' + Math.round((bHrv - rHrv) / bHrv * 100) + '%'); }
  if (rRec != null && rRec < 40) { signals++; reasons.push('recovery sitting low'); }
  const endOfBlock = [3, 7, 11].includes(week);
  // Today's recovery is the strongest single signal. If the most recent recovery is solidly
  // green (>=67), don't raise a deload/fatigue flag off trend deltas alone - on tren, HRV/RHR
  // run chronically suppressed so the baseline comparison produces false fatigue signals.
  const latestRec = sorted.length ? sorted[sorted.length-1].recovery : null;
  const greenNow = latestRec != null && latestRec >= 67;
  let level, msg;
  if (signals >= 2 && !greenNow) { level = 'deload'; msg = 'Fatigue is accumulating (' + reasons.join(', ') + '). Consider a deload or cut volume 30-40% this week.'; }
  else if (signals === 1 && !greenNow) { level = 'moderate'; msg = 'Early fatigue signal (' + reasons.join(', ') + '). Hold volume, prioritise sleep, and watch your performance.'; }
  else { level = 'fresh'; msg = endOfBlock ? 'Recovery is holding well — you could push one more hard week before deloading.' : 'Recovery is holding well — keep progressing as planned.'; }
  if (endOfBlock && level === 'moderate' && !greenNow) { level = 'deload'; msg = 'End of an accumulation block and ' + reasons.join(', ') + ' — a deload is well timed now.'; }
  return { level, msg, rRec: rRec != null ? Math.round(rRec) : null, bRec: bRec != null ? Math.round(bRec) : null, rHrv: rHrv != null ? Math.round(rHrv) : null, bHrv: bHrv != null ? Math.round(bHrv) : null };
}

function parseWhoopWorkouts(raw) {
  const records = raw?.records || raw?.data || [];
  return records.map(w => {
    const s = w.score || w;
    return {
      start: w.start || w.during?.lower || null,
      end: w.end || w.during?.upper || w.start || null,
      strain: s.strain != null ? Math.round(s.strain * 10) / 10 : null,
      avgHr: s.average_heart_rate != null ? Math.round(s.average_heart_rate) : null,
      maxHr: s.max_heart_rate != null ? Math.round(s.max_heart_rate) : null,
      kcal: s.kilojoule != null ? Math.round(s.kilojoule / 4.184) : null,
      // Zone durations (millis in HR zones 0-5). Zone 2+ is the cardio-relevant band:
      // WHOOP zone_two upward corresponds to the sustained aerobic work that counts as
      // zone-2 training, so this can populate the Cardio card without manual logging.
      z2Min: (() => {
        const z = s.zone_durations || s.zone_duration || null;
        if (!z) return null;
        const ms = (z.zone_two_milli||0) + (z.zone_three_milli||0);
        return ms > 0 ? Math.round(ms/60000) : 0;
      })(),
      zoneMin: (() => {
        const z = s.zone_durations || s.zone_duration || null;
        if (!z) return null;
        return { z1:Math.round((z.zone_one_milli||0)/60000), z2:Math.round((z.zone_two_milli||0)/60000),
                 z3:Math.round((z.zone_three_milli||0)/60000), z4:Math.round((z.zone_four_milli||0)/60000),
                 z5:Math.round((z.zone_five_milli||0)/60000) };
      })(),
      sport: w.sport_name || null,
      distanceKm: s.distance_meter != null ? Math.round(s.distance_meter/100)/10 : null,
    };
  }).filter(w => w.start && w.strain != null);
}
function matchWorkout(log, workouts) {
  if (!workouts || !workouts.length || !log.date) return null;
  const end = new Date(log.date).getTime();
  const start = end - (log.duration || 60) * 60000;
  let best = null, bestOv = 0;
  for (const w of workouts) {
    const ws = new Date(w.start).getTime(), we = new Date(w.end || w.start).getTime();
    const ov = Math.min(end, we) - Math.max(start, ws);
    if (ov > bestOv) { bestOv = ov; best = w; }
  }
  return bestOv > 5 * 60000 ? best : null;
}

const ORM_IDS = (() => { const s=new Set(); for(const k in SESSIONS) for(const e of SESSIONS[k].exercises) if(e.orm) s.add(e.id); return s; })();

// ---- Strength-retention index (the cut KPI) ----
// For each `orm` compound: compare best e1RM in the trailing 21 days vs the 21 days before
// that. Average the %Δ across lifts with data in BOTH windows. Read alongside the weight
// trend: weight down + e1RM held/up = fat loss; both down = losing muscle, deficit too steep.
// Actual LOGGED sets per muscle per training week. The heat map shows what the programme
// PLANS; this shows what was really done — swaps, skipped sets and abandoned sessions all
// change the answer, and only the logged version can tell you whether volume actually landed.
function computeActualVolume(logs, block) {
  const rows = (logs||[]).filter(s => s && s.week && (block==null || s.block===block) && Array.isArray(s.exercises));
  if (!rows.length) return null;
  const byWeek = {}, deloadWeeks = new Set(), sessionsByWeek = {};
  for (const s of rows) {
    const w = s.week;
    // A deload week is half volume by design — including it in the average would read as
    // under-training. Track it, show it, but leave it out of the per-week average.
    if (s.deload === true || (s.deload == null && DLW.has(w))) deloadWeeks.add(w);
    (sessionsByWeek[w] = sessionsByWeek[w] || new Set()).add(s.sessionId);
    if (!byWeek[w]) byWeek[w] = {};
    for (const e of s.exercises) {
      if (!e || !Array.isArray(e.sets) || !e.sets.length) continue;
      // A swapped exercise logs under its own id; fall back to the id it replaced.
      const m = EX_MUSCLE[e.id] || EX_MUSCLE[e.origId];
      if (!m) continue;
      const n = e.sets.filter(st => st && (st.reps||0) > 0).length;
      if (!n) continue;
      byWeek[w][m.p] = (byWeek[w][m.p]||0) + n;
      if (m.s) (Array.isArray(m.s)?m.s:[m.s]).forEach(sm => { byWeek[w][sm] = (byWeek[w][sm]||0) + n*0.5; });
    }
  }
  const weeks = Object.keys(byWeek).map(Number).sort((a,b)=>a-b);
  if (!weeks.length) return null;
  const latest = weeks[weeks.length-1];
  // Include a week in the average when it is COMPLETE, judged by distinct sessions logged
  // (>= the 4/week target), not by its position in the array. The old `weeks.slice(0, -1)`
  // always dropped the newest week, so a single fully-completed week reported 0 completed weeks
  // and the whole card stayed hidden. The latest week is still excluded while it's in progress.
  const SESSIONS_PER_WEEK = 4;
  const weekComplete = w => (sessionsByWeek[w] ? sessionsByWeek[w].size : 0) >= SESSIONS_PER_WEEK;
  const done = weeks.filter(w => !deloadWeeks.has(w) && (w !== latest || weekComplete(latest)));
  const avg = {};
  if (done.length) {
    for (const mus of Object.keys(MUSCLES)) {
      let t=0; for (const w of done) t += (byWeek[w][mus]||0);
      avg[mus] = +(t/done.length).toFixed(1);
    }
  }
  return { byWeek, weeks, latest, avg, completedWeeks: done.length, deloadWeeks: [...deloadWeeks] };
}

// Per-exercise plateau detection. For each exercise, take the best e1RM per session across
// the last N non-deload sessions; if the most recent sessions haven't beaten the best of the
// earlier ones, the lift is stalled. Deload sessions are excluded (85% load isn't a stall)
// and a lift needs >=3 sessions before any verdict — two points is noise, not a trend.
// Session duration analytics. Duration is wall-clock from start to finish, so a session that
// was paused and resumed hours later logs an inflated time. Anything over OUTLIER_MIN is
// excluded from averages (but still plotted, flagged) so one abandoned session can't skew
// the picture. Averages are per session TYPE, since Upper 3 is legitimately shorter than Lower.
function computeDurations(logs, limit = 20) {
  const OUTLIER_MIN = 150;
  const rows = (logs||[]).filter(s => s && typeof s.duration === 'number' && s.duration > 0);
  if (!rows.length) return null;
  const recent = rows.slice(0, limit).reverse();   // logs are newest-first; chart oldest->newest
  const series = recent.map(s => ({
    x: fmtShort(s.date),
    y: s.duration,
    name: s.sessionName || (SESSIONS[s.sessionId] && SESSIONS[s.sessionId].name) || '?',
    outlier: s.duration > OUTLIER_MIN
  }));
  const byType = {};
  for (const s of rows) {
    const key = s.sessionId || 'unknown';
    const name = s.sessionName || (SESSIONS[key] && SESSIONS[key].name) || 'Unknown';
    const rec = (byType[key] = byType[key] || { name, durs: [], excluded: 0, planned: (SESSIONS[key] && SESSIONS[key].time) || null });
    if (s.duration > OUTLIER_MIN) { rec.excluded++; continue; }
    rec.durs.push(s.duration);
  }
  const types = [];
  for (const key in byType) {
    const r = byType[key];
    if (!r.durs.length) continue;
    const sorted = [...r.durs].sort((a,b)=>a-b);
    const avg = Math.round(r.durs.reduce((a,b)=>a+b,0) / r.durs.length);
    const med = sorted.length % 2 ? sorted[(sorted.length-1)/2] : Math.round((sorted[sorted.length/2-1]+sorted[sorted.length/2])/2);
    types.push({ key, name: r.name, avg, med, n: r.durs.length,
                 min: sorted[0], max: sorted[sorted.length-1], excluded: r.excluded, planned: r.planned });
  }
  types.sort((a,b) => b.avg - a.avg);
  const clean = rows.filter(s => s.duration <= OUTLIER_MIN);
  const overall = clean.length ? Math.round(clean.reduce((a,b)=>a+b.duration,0)/clean.length) : null;
  const outliers = rows.length - clean.length;
  return { series, types, overall, n: clean.length, outliers };
}

function computeStalls(logs, minSessions = 3, bwAt = null) {
  const byEx = {};
  for (const l of (logs||[])) {
    if (l.deload === true) continue;
    if (l.deload == null && DLW.has(l.week)) continue;
    const t = new Date(l.date).getTime();
    if (isNaN(t)) continue;
    for (const ex of (l.exercises||[])) {
      if (!ex || !Array.isArray(ex.sets) || !ex.sets.length) continue;
      const pid = ex.origId || ex.id;
      const best = Math.max(...ex.sets.map(s => epley(totalLoad(pid, s.weight, bwAt, l.date), s.reps||0)));
      if (!best || !isFinite(best)) continue;
      (byEx[pid] = byEx[pid] || { name: ex.name, pts: [] }).pts.push({ t, e1rm: best });
    }
  }
  const stalled = [], progressing = [];
  for (const pid in byEx) {
    const rec = byEx[pid];
    // logs are newest-first; sort explicitly so order is not assumed
    rec.pts.sort((a,b) => b.t - a.t);
    const pts = rec.pts.slice(0, 6);
    if (pts.length < minSessions) continue;
    const recent = pts.slice(0, 2).map(p => p.e1rm);       // last 2 sessions
    const earlier = pts.slice(2).map(p => p.e1rm);          // the 3rd back and older
    if (!earlier.length) continue;
    const bestRecent = Math.max(...recent), bestEarlier = Math.max(...earlier);
    const pct = bestEarlier > 0 ? ((bestRecent - bestEarlier) / bestEarlier) * 100 : 0;
    // Sessions elapsed since the all-time peak e1RM for this lift (newest-first walk).
    const all = rec.pts.map(p => p.e1rm);
    const peak = Math.max(...all);
    let sincePeak = 0;
    for (const x of all) { if (x >= peak - 0.001) break; sincePeak++; }
    const entry = { id: pid, name: rec.name, sessions: pts.length,
                    bestRecent: Math.round(bestRecent), bestEarlier: Math.round(bestEarlier),
                    pct: +pct.toFixed(1),
                    sessionsSincePeak: sincePeak, peakE1rm: Math.round(peak), lastE1rm: Math.round(all[0]),
                    isOrm: ORM_IDS.has(pid) };
    // A stall is no meaningful improvement (<1%) over the older sessions.
    if (pct < 1) stalled.push(entry); else progressing.push(entry);
  }
  stalled.sort((a,b) => a.pct - b.pct);
  progressing.sort((a,b) => b.pct - a.pct);
  if (!stalled.length && !progressing.length) return null;
  return { stalled, progressing, total: stalled.length + progressing.length };
}

// Pain by exercise. Pain is logged 0/1/2 (none/niggle/sharp) on every exercise of every
// session, but until now only the most recent session's flag was used. For a lifter whose
// goal includes joint longevity, the pattern that matters is WHICH exercises repeatedly
// produce pain — a lift that niggles once is noise, one that niggles most sessions is a
// signal to change the movement, not to push through it.
function computePainTrend(logs, minSessions = 3) {
  const byEx = {};
  for (const l of (logs||[])) {
    const t = new Date(l.date).getTime();
    if (isNaN(t)) continue;
    for (const ex of (l.exercises||[])) {
      if (!ex) continue;
      const pid = ex.origId || ex.id;
      const rec = (byEx[pid] = byEx[pid] || { name: ex.name, pts: [] });
      rec.pts.push({ t, pain: ex.pain || 0 });
    }
  }
  const flagged = [];
  let totalSessions = 0, painSessions = 0;
  for (const pid in byEx) {
    const rec = byEx[pid];
    rec.pts.sort((a,b) => b.t - a.t);
    if (rec.pts.length < minSessions) continue;
    const n = rec.pts.length;
    const anyPain = rec.pts.filter(p => p.pain > 0).length;
    const sharp = rec.pts.filter(p => p.pain === 2).length;
    totalSessions += n; painSessions += anyPain;
    if (!anyPain) continue;
    // Direction: is it getting worse? Compare last 3 sessions against the ones before.
    const recent = rec.pts.slice(0,3), earlier = rec.pts.slice(3);
    const rRate = recent.filter(p=>p.pain>0).length / recent.length;
    const eRate = earlier.length ? earlier.filter(p=>p.pain>0).length / earlier.length : null;
    const dir = eRate==null ? 'flat' : rRate > eRate + 0.15 ? 'worsening' : rRate < eRate - 0.15 ? 'improving' : 'flat';
    flagged.push({ id:pid, name:rec.name, sessions:n, painCount:anyPain, sharpCount:sharp,
                   rate:Math.round(anyPain/n*100), dir,
                   severity: sharp>0 ? 'sharp' : 'niggle' });
  }
  if (!flagged.length && totalSessions===0) return null;
  flagged.sort((a,b) => (b.sharpCount - a.sharpCount) || (b.rate - a.rate));
  return { flagged, overallRate: totalSessions ? Math.round(painSessions/totalSessions*100) : 0 };
}

// Does training on low recovery actually cost performance? Splits sessions by the WHOOP
// recovery recorded that day and compares mean e1RM per lift, normalised so lifts with big
// absolute loads don't dominate. This is descriptive, not causal — a low-recovery day may
// coincide with a deload or a bad night — but it either supports or undermines the
// green-recovery veto with the user's own data instead of an assumption.
function computeRecoveryPerformance(logs, whoopHistory, bwAt = null) {
  const recByDate = {};
  for (const h of (whoopHistory||[])) if (h && h.date && h.recovery != null) recByDate[h.date] = h.recovery;
  if (!Object.keys(recByDate).length) return null;
  const rows = perfRows(logs, l => {
    const rec = recByDate[(l.date||'').slice(0,10)];
    if (rec == null) return null;
    return rec < 34 ? 'low' : rec < 67 ? 'mid' : 'high';
  }, bwAt);
  if (rows.length < 8) return null;
  const r = relPerfByBucket(rows);
  if (!r) return null;
  // One point PER SESSION for the scatter: mean relative e1RM across that session's lifts,
  // paired with the day's recovery. Per-exercise points would cluster by session and
  // overstate how much independent evidence there is.
  const meanBy = {};
  for (const x of rows) (meanBy[x.pid] = meanBy[x.pid] || []).push(x.e1rm);
  for (const k in meanBy) { const a = meanBy[k]; meanBy[k] = a.reduce((p,q)=>p+q,0)/a.length; }
  const bySession = {};
  for (const x of rows) {
    const m = meanBy[x.pid]; if (!m) continue;
    const rel = (x.e1rm/m - 1) * 100;
    (bySession[x.sid] = bySession[x.sid] || { rels: [], sdate: x.sdate }).rels.push(rel);
  }
  const points = [];
  for (const sid in bySession) {
    const rec = recByDate[(bySession[sid].sdate||'').slice(0,10)];
    const rl = bySession[sid].rels;
    if (rec == null || !rl.length) continue;
    points.push({ x: rec, y: +(rl.reduce((p,q)=>p+q,0)/rl.length).toFixed(1) });
  }
  const high = r.high && r.high.mean, mid = r.mid && r.mid.mean, low = r.low && r.low.mean;
  const usable = [high, mid, low].filter(v => v != null).length;
  if (usable < 2) return null;
  let verdict = null, gap = null, provisional = false;
  const cmpVal = low != null ? low : mid;
  const cmpKey = low != null ? 'low' : 'mid';
  if (high != null && cmpVal != null) {
    gap = +(high - cmpVal).toFixed(1);
    // Only judge when BOTH compared groups clear the verdict bar. Otherwise report the gap
    // as an early signal — the difference may be real, but this many sessions cannot show it.
    const enough = r.high.sessions >= PERF_MIN_VERDICT && r[cmpKey].sessions >= PERF_MIN_VERDICT;
    if (enough) verdict = gap > 3 ? 'costly' : gap < -3 ? 'inverse' : 'negligible';
    else provisional = true;
  }
  return {
    high, mid, low, gap, verdict, provisional, points,
    minVerdict: PERF_MIN_VERDICT,
    highN: r.high ? r.high.sessions : 0,
    midN:  r.mid  ? r.mid.sessions  : 0,
    lowN:  r.low  ? r.low.sessions  : 0,
    totalSessions: new Set(rows.map(x => x.sid)).size
  };
}

// Weekly training load (tonnage = sets x reps x weight) with an acute:chronic ratio.
// HONEST FRAMING: ACWR was popularised as an injury-risk predictor and has since taken
// substantial methodological criticism — the predictive claims have not replicated well.
// It is used here purely descriptively: "this week vs your recent norm". It is NOT an
// injury forecast and the card says so.
function computeTrainingLoad(logs, weeks = 8) {
  const dayMs = 86400000, now = Date.now();
  const buckets = [];
  for (let w = 0; w < weeks; w++) {
    const hi = now - w*7*dayMs, lo = hi - 7*dayMs;
    let tonnage = 0, sessions = 0;
    for (const l of (logs||[])) {
      const t = new Date(l.date).getTime();
      if (isNaN(t) || t <= lo || t > hi) continue;
      sessions++;
      for (const ex of (l.exercises||[])) for (const s of (ex.sets||[])) tonnage += (s.weight||0) * (s.reps||0);
    }
    buckets.push({ weeksAgo: w, tonnage: Math.round(tonnage), sessions });
  }
  const series = buckets.slice().reverse();
  if (!series.some(b => b.tonnage > 0)) return null;
  const acute = buckets[0].tonnage;
  const prior = buckets.slice(1, 5).filter(b => b.tonnage > 0);
  const chronic = prior.length ? Math.round(prior.reduce((a,b)=>a+b.tonnage,0)/prior.length) : null;
  const ratio = chronic ? +(acute/chronic).toFixed(2) : null;
  let verdict = null;
  if (ratio != null && prior.length >= 2) {
    verdict = ratio > 1.5 ? 'spike' : ratio < 0.7 ? 'drop' : 'steady';
  }
  return { series, acute, chronic, ratio, verdict, weeksOfData: buckets.filter(b=>b.tonnage>0).length };
}

// Shared engine for "does condition X change my lifting?" questions. Takes rows of
// {pid, e1rm, bucket, sid}, normalises each lift against its OWN mean so heavy compounds
// don't dominate, and returns mean relative performance per bucket. Used by the recovery,
// time-of-day and alcohol analytics so all three answer the same shape of question with
// identical maths.
// Two thresholds, not one. MIN_SHOW is the point at which a bucket's mean is worth
// displaying; MIN_VERDICT is the much higher bar for turning that mean into behavioural
// advice. Three sessions is enough to plot a number and nowhere near enough to tell someone
// to change when they train or whether to drink. Between the two, the card shows the figures
// and labels them an early signal instead of issuing a verdict.
const PERF_MIN_SHOW = 3;
const PERF_MIN_VERDICT = 8;

function relPerfByBucket(rows, minSessions = PERF_MIN_SHOW) {
  if (!rows.length) return null;
  const meanBy = {};
  for (const r of rows) (meanBy[r.pid] = meanBy[r.pid] || []).push(r.e1rm);
  for (const k in meanBy) { const a = meanBy[k]; meanBy[k] = a.reduce((x,y)=>x+y,0)/a.length; }
  const acc = {};
  for (const r of rows) {
    const m = meanBy[r.pid];
    if (!m) continue;
    const rel = (r.e1rm/m - 1) * 100;
    const b = (acc[r.bucket] = acc[r.bucket] || { n:0, sum:0, sids:new Set() });
    b.n++; b.sum += rel; if (r.sid) b.sids.add(r.sid);
  }
  const out = {};
  // Gate on distinct SESSIONS, not rows. One session contributes ~8 exercise-rows, so a
  // row-based minimum would let a single day's training qualify a bucket and produce a
  // confident-looking verdict from one session.
  for (const k in acc) {
    const sess = acc[k].sids.size || 0;
    out[k] = { n: acc[k].n, sessions: sess,
               mean: sess >= minSessions ? +(acc[k].sum/acc[k].n).toFixed(1) : null,
               provisional: sess < PERF_MIN_VERDICT };
  }
  return out;
}

// One row per exercise per non-deload session, tagged by a caller-supplied bucket.
function perfRows(logs, bucketFn, bwAt = null) {
  const rows = [];
  for (const l of (logs||[])) {
    if (l.deload === true || (l.deload == null && DLW.has(l.week))) continue;
    const bucket = bucketFn(l);
    if (bucket == null) continue;
    for (const ex of (l.exercises||[])) {
      if (!ex || !Array.isArray(ex.sets) || !ex.sets.length) continue;
      const pid = ex.origId||ex.id;
      const best = Math.max(...ex.sets.map(s => epley(totalLoad(pid, s.weight, bwAt, l.date), s.reps||0)));
      if (!best || !isFinite(best)) continue;
      rows.push({ pid, e1rm: best, bucket, sid: l.id || l.date });
    }
  }
  return rows;
}

// Performance by time of day. Session start is recoverable: logs store the END time plus
// duration, so start = date - duration.
//
// Bands are deliberately finer than "morning vs evening" so the card reflects when the user
// ACTUALLY trains rather than a preset assumption. The trade-off: narrow bands hold fewer
// sessions, and a band needs >=3 sessions before its mean is trustworthy. So every populated
// band is shown, but the verdict compares the two bands with the most sessions — whichever
// those happen to be. That adapts to any schedule instead of hardcoding one.
const TOD_BANDS = [
  { k:'early',   label:'Early morning', sub:'before 7am',  lo:0,  hi:7  },
  { k:'morning', label:'Morning',       sub:'7am - 11am',  lo:7,  hi:11 },
  { k:'midday',  label:'Midday',        sub:'11am - 4pm',  lo:11, hi:16 },
  { k:'evening', label:'Evening',       sub:'4pm - 8pm',   lo:16, hi:20 },
  { k:'late',    label:'Late evening',  sub:'8pm onwards', lo:20, hi:24 },
];

function computeTimeOfDay(logs, bwAt = null) {
  const startMins = {};   // band -> list of start times in minutes, for the real average
  const rows = perfRows(logs, l => {
    const end = new Date(l.date).getTime();
    if (isNaN(end)) return null;
    const d = new Date(end - (l.duration||60)*60000);
    const h = d.getHours();
    const band = TOD_BANDS.find(b => h >= b.lo && h < b.hi);
    if (!band) return null;
    (startMins[band.k] = startMins[band.k] || []).push(h*60 + d.getMinutes());
    return band.k;
  }, bwAt);
  if (rows.length < 8) return null;
  const r = relPerfByBucket(rows);
  if (!r) return null;

  const bands = TOD_BANDS
    .filter(b => r[b.k])
    .map(b => {
      const mins = startMins[b.k] || [];
      const avgMin = mins.length ? Math.round(mins.reduce((a,x)=>a+x,0)/mins.length) : null;
      return {
        ...b,
        sessions: r[b.k].sessions,
        mean: r[b.k].mean,
        typical: avgMin == null ? null
          : String(Math.floor(avgMin/60)).padStart(2,'0') + ':' + String(avgMin%60).padStart(2,'0')
      };
    });

  // Compare the two most-used bands, not a preset pair.
  const ranked = bands.filter(b => b.mean != null).sort((a,b) => b.sessions - a.sessions);
  let verdict = null, gap = null, better = null, worse = null, provisional = false;
  if (ranked.length >= 2) {
    const [a, b] = ranked.slice(0, 2);
    const hi = a.mean >= b.mean ? a : b;
    const lo = a.mean >= b.mean ? b : a;
    gap = +(hi.mean - lo.mean).toFixed(1);
    better = hi; worse = lo;
    // Telling someone to move their training slot is a real behavioural ask; it needs more
    // than a handful of sessions per slot before it is anything other than a guess.
    if (hi.sessions >= PERF_MIN_VERDICT && lo.sessions >= PERF_MIN_VERDICT) {
      verdict = gap > 2 ? 'clear' : 'nodiff';
    } else provisional = true;
  }
  return { bands, verdict, gap, better, worse, provisional, minVerdict: PERF_MIN_VERDICT,
           total: new Set(rows.map(x=>x.sid)).size };
}

// Alcohol vs lifting. A session counts as "after drinking" if units were logged that day or
// the day before — alcohol's effect on sleep and recovery carries into the next day.
function computeAlcoholImpact(logs, contextLog, bwAt = null) {
  const drinkDays = new Set();
  for (const c of (contextLog||[])) {
    if (!c || !(c.units > 0)) continue;
    const d = (c.date||'').slice(0,10);
    if (d) drinkDays.add(d);
  }
  if (!drinkDays.size) return null;
  const dayMs = 86400000;
  const rows = perfRows(logs, l => {
    const t = new Date(l.date).getTime();
    if (isNaN(t)) return null;
    const today = new Date(t).toISOString().slice(0,10);
    const yest  = new Date(t - dayMs).toISOString().slice(0,10);
    return (drinkDays.has(today) || drinkDays.has(yest)) ? 'after' : 'clear';
  }, bwAt);
  if (rows.length < 8) return null;
  const r = relPerfByBucket(rows);
  if (!r || !r.after || !r.clear) return null;
  const a = r.after.mean, c = r.clear.mean;
  let verdict = null, gap = null, provisional = false;
  if (a != null && c != null) {
    gap = +(a - c).toFixed(1);
    if (r.after.sessions >= PERF_MIN_VERDICT && r.clear.sessions >= PERF_MIN_VERDICT) {
      verdict = gap < -2 ? 'costly' : gap > 2 ? 'inverse' : 'negligible';
    } else provisional = true;
  }
  return { ...r, verdict, gap, provisional, minVerdict: PERF_MIN_VERDICT,
           total: new Set(rows.map(x=>x.sid)).size, drinkDays: drinkDays.size };
}

function computeStrengthRetention(logs, bwAt) {
  const dayMs=86400000, nowTs=Date.now();
  const recentStart=nowTs-21*dayMs, priorStart=nowTs-42*dayMs;
  const byEx={};
  for (const l of logs) {
    const t=new Date(l.date).getTime();
    if (isNaN(t) || t<priorStart || t>nowTs) continue;
    // Skip deload sessions: an 85%-load week would read as strength loss that isn't real.
    // Tagged logs carry l.deload; legacy logs fall back to the scheduled-deload weeks.
    if (l.deload === true) continue;
    if (l.deload == null && DLW.has(l.week)) continue;
    const win = t>=recentStart ? 'recent' : 'prior';
    for (const ex of (l.exercises||[])) {
      if (!ex.sets || !ex.sets.length) continue;
      const pid=ex.origId||ex.id;
      if (!ORM_IDS.has(pid)) continue;
      const best=Math.max(...ex.sets.map(s=>epley(totalLoad(pid, s.weight, bwAt, l.date),s.reps||0)));
      if (!best || !isFinite(best)) continue;
      const rec=(byEx[pid]=byEx[pid]||{name:ex.name,recent:0,prior:0});
      if (best>rec[win]) rec[win]=best;
    }
  }
  const lifts=[];
  for (const id in byEx) {
    const r=byEx[id];
    if (r.recent>0 && r.prior>0) lifts.push({name:r.name, pct:+(((r.recent-r.prior)/r.prior)*100).toFixed(1), recent:Math.round(r.recent), prior:Math.round(r.prior)});
  }
  if (!lifts.length) return null;
  const avgPct=+(lifts.reduce((a,l)=>a+l.pct,0)/lifts.length).toFixed(1);
  return { avgPct, lifts: lifts.sort((a,b)=>a.pct-b.pct) };
}

// ---- Context flags: attribution, not just logging ----
// A recovery dip that follows alcohol, illness or a bad night is TRANSIENT and must not be
// read as accumulated training fatigue. Returns the flag relevant to today's readiness.
const CTX_TAGS = [
  {id:'illness', label:'Illness'},
  {id:'poorsleep', label:'Bad night'},
  {id:'travel', label:'Travel'},
  {id:'stress', label:'High stress'},
];
function ctxForDate(contextLog, dateStr) {
  return (contextLog||[]).find(c => (c.date||'').slice(0,10) === dateStr) || null;
}
// Alcohol suppresses REM and drops HRV for 24-48h, so yesterday counts as well as today.
function recentCtx(contextLog) {
  const d = new Date();
  const day = n => { const x=new Date(d); x.setDate(x.getDate()-n); return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`; };
  const today = ctxForDate(contextLog, day(0)), yest = ctxForDate(contextLog, day(1));
  const reasons = [];
  const pick = (c, when) => {
    if (!c) return;
    if (c.units > 0) reasons.push(`alcohol ${c.units}u ${when}`);
    (c.tags||[]).forEach(t => { const m=CTX_TAGS.find(x=>x.id===t); if(m) reasons.push(m.label.toLowerCase()+' '+when); });
  };
  pick(today, 'today'); pick(yest, 'yesterday');
  return reasons.length ? reasons : null;
}

// ---- Deload rebound: does a deload actually pay off for THIS athlete? ----
// Compares best e1RM on tracked compounds in the 7 days AFTER a deload week against the 7
// days BEFORE it. Positive = the deload bought you strength. Repeatedly negative/flat means
// deloads are costing you a week — real evidence for the take-vs-train-through decision.
function computeDeloadRebound(logs, bwAt) {
  const isDeloadLog = l => l.deload === true || (l.deload == null && DLW.has(l.week));
  const deloadWeeks = {};
  for (const l of logs) { if (isDeloadLog(l)) { const k=(l.block||1)+'-'+l.week; deloadWeeks[k]={block:l.block||1, week:l.week}; } }
  // Best e1RM per LIFT (keyed by slot id), not one global maximum. Comparing a global max
  // before against a global max after could pair a pre-deload RDL with a post-deload leg press
  // and call the difference "rebound". Pairing by lift measures the same movement either side.
  const bestByEx = (arr) => {
    const m = {};
    for (const l of arr) for (const ex of (l.exercises||[])) {
      if (!ex.sets || !ex.sets.length) continue;
      const pid=ex.origId||ex.id;
      if (!ORM_IDS.has(pid)) continue;
      const e=Math.max(...ex.sets.map(s=>epley(totalLoad(pid, s.weight, bwAt, l.date),s.reps||0)));
      if (!(pid in m) || e>m[pid]) m[pid]=e;
    }
    return m;
  };
  const out = [];
  for (const k in deloadWeeks) {
    const { block, week } = deloadWeeks[k];
    const before = logs.filter(l => (l.block||1)===block && l.week===week-1 && !isDeloadLog(l));
    const after  = logs.filter(l => (l.block||1)===block && l.week===week+1 && !isDeloadLog(l));
    if (!before.length || !after.length) continue;
    const B=bestByEx(before), A=bestByEx(after);
    // One paired % delta per lift present on BOTH sides, then average those — so a lift missing
    // from either week is simply skipped rather than distorting the comparison.
    const deltas=[];
    for (const pid in A) { if (B[pid]>0) deltas.push(((A[pid]-B[pid])/B[pid])*100); }
    if (!deltas.length) continue;
    const pct = deltas.reduce((s,d)=>s+d,0)/deltas.length;
    out.push({ block, week, pct:+pct.toFixed(1), lifts:deltas.length });
  }
  if (!out.length) return null;
  const avg=+(out.reduce((s,o)=>s+o.pct,0)/out.length).toFixed(1);
  return { avg, events: out.sort((x,y)=> (y.block-x.block)||(y.week-x.week)) };
}

// ---- RIR drift: are logged reps-in-reserve matching the prescription? ----
// Positive drift = logging further from failure than the EFFECTIVE target for that exercise
// (the higher of the weekly RIR and the exercise's own floor). Negative = training harder
// than programmed, a creeping-overreach signal. P0.3: the comparison is per-exercise and
// floor-aware, so a protected 1-RIR lift on a 0-RIR week is NOT flagged as easy — that is the
// prescription, not sandbagging. A residual positive drift can still be pain, technique or a
// wrong default, so the wording below stays non-accusatory.
function computeRirDrift(logs, block) {
  const byWeek = {};
  for (const l of logs) {
    if ((l.block||1) !== block) continue;
    const dl = l.deload === true || (l.deload == null && DLW.has(l.week));
    const weekRirN = effWR(l.week, dl).rirN;
    if (weekRirN == null) continue;
    for (const ex of (l.exercises||[])) {
      const target = rirDefaultFor(EX_DEF_BY_ID[ex.id], weekRirN); // per-exercise effective floor
      for (const s of (ex.sets||[])) {
        const r = (s.rir === '4+') ? 4 : (s.rir == null ? null : Number(s.rir));
        if (r == null || !isFinite(r)) continue;
        const w=(byWeek[l.week]=byWeek[l.week]||{sum:0,n:0,target:weekRirN});
        w.sum += (r - target); w.n++;
      }
    }
  }
  const weeks = Object.keys(byWeek).map(Number).sort((a,b)=>a-b);
  if (!weeks.length) return null;
  const rows = weeks.map(w => ({ week:w, drift:+(byWeek[w].sum/byWeek[w].n).toFixed(2), n:byWeek[w].n, target:byWeek[w].target }));
  const recent = rows.slice(-4);
  const avg = +(recent.reduce((s,r)=>s+r.drift,0)/recent.length).toFixed(2);
  return { rows, avg };
}

// ---- BP vs training load ----
// Assigns each BP reading to a training week by date range, then pairs weekly mean systolic
// against weekly volume-load. On an enhanced protocol BP is the health marker most likely to

// ---- WHOOP burn cross-check ----
// Compares WHOOP's measured daily expenditure (COMPLETED cycles only) against the empirical
// maintenance derived from intake vs weight trend. Agreement raises confidence in both; a
// large gap means one of them is wrong and the empirical figure should be trusted.
function computeBurnCheck(whoopHistory, tdee) {
  if (!tdee) return null;
  const finals = (whoopHistory||[]).filter(h => h.dayCalFinal && h.dayCal > 0).slice(-14);
  if (finals.length < 5) return null;
  const avg = Math.round(finals.reduce((s,h)=>s+h.dayCal,0)/finals.length);
  const gap = avg - tdee;
  return { avg, tdee, gap, days: finals.length, agree: Math.abs(gap) <= 250 };
}

const ALT_BY_MUSCLE = {
  chest:[{name:'Machine Chest Press'},{name:'Pec Deck'},{name:'Dumbbell Press'},{name:'Cable Press'}],
  lats:[{name:'Lat Pulldown'},{name:'Pull-Up'},{name:'Straight-Arm Pulldown'}],
  midBack:[{name:'Chest-Supported Row'},{name:'Cable Row'},{name:'Machine Row'}],
  sideDelt:[{name:'DB Lateral Raise'},{name:'Machine Lateral Raise'},{name:'Cable Y-Raise'}],
  rearDelt:[{name:'Reverse Pec Deck'},{name:'Face Pull'},{name:'DB Rear Delt Flye'}],
  biceps:[{name:'Cable Curl'},{name:'DB Curl'},{name:'Preacher Curl'},{name:'Hammer Curl'}],
  triceps:[{name:'Cable Pushdown'},{name:'Overhead Cable Ext'},{name:'Dip Machine'},{name:'Skull Crusher'}],

function mergeLogs(a, b) {
  const map = new Map(); const order = [];
  // Key on the immutable id (falling back to a deterministic legacy id). Keying on
  // date|sessionId meant an edit that changed either field created a phantom second
  // workout instead of being recognised as the same record.
  for (const l of [...(a || []), ...(b || [])]) {
    if (!l || !l.date) continue;
    const key = l.id || legacyId(l, 'wk');
    if (map.has(key)) { map.set(key, pickNewer(map.get(key), l)); }
    else { map.set(key, l); order.push(key); }
  }
  const out = order.map(k => map.get(k));
  out.sort((x, y) => x.date < y.date ? 1 : -1);
  return out.slice(0, 600);   // must match the setLogs cap, or a sync would silently truncate history back to 200
}
// LAST-WRITE-WINS merge. The old implementation was first-wins over [...local, ...cloud],
// so the LOCAL copy always beat the cloud copy even when the cloud held a newer edit —
// the newer edit was discarded and then overwritten on the next push. Records now carry
// updatedAt (stamped on save); when both sides hold the same key we keep the newer one.
// ---- Record identity & sync schema ----
// Records need an IMMUTABLE id. Merge keys previously embedded the mutable value
// (date|weight, date|sys|dia ...), so editing a value produced a DIFFERENT key,
// pickNewer() never fired, and both the old and edited record survived as duplicates.
function newId() {
  try { if (typeof crypto !== 'undefined' && crypto.randomUUID) return crypto.randomUUID(); } catch(e){}
  return 'r' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
}
// Deterministic legacy id so the SAME pre-migration record gets the SAME id on every
// device — otherwise migration itself would create cross-device duplicates.
function legacyId(e, kind, index) {
  // Must distinguish MULTIPLE same-day records (two BP readings on one date previously
  // hashed identically and mergeByKey then discarded one as a duplicate version).
  const parts = [kind, e.date||'', e.site||'', e.compound||'', e.modality||'', e.sessionId||'',
                 e.sys ?? '', e.dia ?? '', e.pulse ?? '', e.value ?? '', e.weight ?? '',
                 e.dose ?? '', e.minutes ?? '', e.calories ?? '', index != null ? index : ''];
  const s = parts.join('|');
  let hh = 5381;
  for (let i = 0; i < s.length; i++) { hh = ((hh << 5) + hh + s.charCodeAt(i)) >>> 0; }
  return 'lg_' + kind + '_' + hh.toString(36);
}
function ensureIds(arr, kind) {
  if (!Array.isArray(arr)) return arr;
  let changed = false;
  const out = arr.map((e, i) => {
    if (!e || e.id) return e;
    changed = true;
    return { ...e, id: legacyId(e, kind, i), updatedAt: e.updatedAt != null ? e.updatedAt : 0 };
  });
  return changed ? out : arr;
}
function live(arr) { return (arr || []).filter(e => e && !e.deletedAt); }
function pruneTombstones(arr, days) {
  const cut = Date.now() - (days || 90) * 86400000;
  return (arr || []).filter(e => !e.deletedAt || e.deletedAt > cut);
}
function pickNewer(x, y) {
  const tx = x && x.updatedAt != null ? x.updatedAt : 0;
  const ty = y && y.updatedAt != null ? y.updatedAt : 0;
  return ty > tx ? y : x;   // ties keep the incumbent (local) — deterministic
}
function mergeByKey(a, b, keyFn) {
  const map = new Map(); const order = [];
  for (const e of [...(a || []), ...(b || [])]) {
    if (!e) continue;
    const k = keyFn(e);
    if (map.has(k)) { map.set(k, pickNewer(map.get(k), e)); }
    else { map.set(k, e); order.push(k); }
  }
  // Tombstones (deletedAt) are RETAINED here so they propagate to other devices via the
  // synced snapshot; the UI filters them out via live(). A newer tombstone beats an older
  // live record through pickNewer(), which is what stops a delete being resurrected.
  const out = order.map(k => map.get(k));
  out.sort((x, y) => (x.date || '') < (y.date || '') ? 1 : -1);
  return out;
}

const MEAS_SITES = ['Waist','Chest','Shoulders','Neck','Hips','Left Arm','Right Arm','Left Forearm','Right Forearm','Left Thigh','Right Thigh','Left Calf','Right Calf'];

function computeReadiness(recovery, whoopData, deloadInfo, logs, week, whoopHistory, latestBP, deloadActive, ctxReasons) {
  const lastLog = logs && logs[0];
  // Pain only counts if it is recent. Previously a sharp-pain flag from the last logged
  // workout capped readiness indefinitely, even after months away.
  const _painAge = lastLog && lastLog.date ? (Date.now() - new Date(lastLog.date).getTime())/86400000 : null;
  const painFresh = _painAge != null && _painAge >= 0 && _painAge <= 14;  // >=0 rejects future-dated logs
  const recentPain = painFresh ? (lastLog?.exercises || []).filter(e => e.pain).map(e => ({ name: e.name, level: e.pain })) : [];
  const sharpPain = recentPain.some(p => p.level === 2);
  const nigglePain = recentPain.some(p => p.level === 1);
  const sharpName = recentPain.find(p => p.level === 2)?.name;
  // WHOOP freshness: cached recovery must not gate today. BP already had this guard;
  // WHOOP did not, so a stale green score could still trigger green_push / high volume.
  const whoopAgeH = whoopData?.cachedAt ? (Date.now() - whoopData.cachedAt)/3600000 : null;
  const whoopStale = whoopAgeH != null && whoopAgeH > 30; // >~1 day old
  const rec = whoopStale ? null : whoopData?.recovery;
  const recLow = rec != null && rec < 34;
  const recMidLow = rec != null && rec >= 34 && rec < 50;
  const recHigh = rec != null && rec >= 67;
  const sleep = whoopStale ? null : whoopData?.sleep;
  const sleepPoor = sleep != null && sleep < 70;
  const sleepGreat = sleep != null && sleep >= 85;
  const subjBeat = recovery === 'beat';
  const subjExcellent = recovery === 'excellent';
  const trend = deloadInfo?.level;
  const deloadWk = deloadActive != null ? deloadActive : [4, 8, 12].includes(week);
  const peakWk = [9, 10, 11].includes(week);

  const factors = [];
  let major = 0, minor = 0, pos = 0;
  if (subjBeat) { major++; factors.push('you flagged feeling beat up'); }
  // Attribution: a dip that follows alcohol, illness or a bad night is transient and is NOT
  // accumulated training fatigue. Name the cause and don't let the TREND signal escalate on
  // it. Today's raw low recovery still counts — you still train easier today, you just don't
  // get told to deload for it.
  const ctxAttributed = !!(ctxReasons && ctxReasons.length);
  if (ctxAttributed) factors.push('recent ' + ctxReasons.join(', ') + ' — likely transient, not training fatigue');
  if (recLow) { major++; factors.push('WHOOP recovery red (' + rec + '%)'); }
  if (trend === 'deload' && !ctxAttributed) { major++; factors.push('fatigue trend building'); }
  if (sleepPoor && !ctxAttributed) { minor++; factors.push('poor sleep (' + sleep + '%)'); }
  if (trend === 'moderate' && !ctxAttributed) { minor++; factors.push('early fatigue signal'); }
  if (nigglePain) { minor++; factors.push('joint niggle flagged last session'); }
  if (recMidLow) { minor++; factors.push('WHOOP recovery low-yellow (' + rec + '%)'); }
  if (subjExcellent) { pos++; factors.push('you feel fresh'); }
  if (recHigh) { pos++; factors.push('WHOOP recovery green (' + rec + '%)'); }
  if (trend === 'fresh') pos++;
  if (sleepGreat) { pos++; factors.push('strong sleep (' + sleep + '%)'); }

  // Cumulative-fatigue + illness signals from the richer WHOOP feed
  const sd = whoopStale ? null : whoopData?.sleepDebt;
  if (sd != null && sd >= 2) { minor++; factors.push('sleep debt ' + sd + 'h'); }
  const rrVals = (whoopHistory || []).map(h => h.respRate).filter(v => v != null);
  if (!whoopStale && whoopData?.respRate != null && rrVals.length >= 5) {
    const baseArr = rrVals.slice(0, -1).slice(-14);
    const baseAvg = baseArr.reduce((a, b) => a + b, 0) / baseArr.length;
    if (whoopData.respRate >= baseAvg + 1) { major++; factors.push('respiratory rate up vs baseline (possible illness)'); }
  }

  const ORDER = ['red_stop', 'red_min', 'amber', 'green_standard', 'green_push'];
  let mode;
  if (deloadWk) mode = 'amber';
  else if (major >= 3 || (sharpPain && major >= 2)) mode = 'red_stop';
  else if (major >= 2) mode = 'red_min';
  else if (major === 1 || minor >= 2) mode = 'amber';
  else if (pos >= 2) mode = 'green_push';
  else mode = 'green_standard';
  if (sharpPain && ORDER.indexOf(mode) > ORDER.indexOf('amber')) mode = 'amber';
  if (peakWk && mode === 'green_standard' && pos >= 1 && major === 0 && !sharpPain) mode = 'green_push';

  // BP hard-gate: a raised MORNING reading caps readiness regardless of recovery (mirrors autoreg gate).
  // Only valid on a same-day reading — BP varies daily, so a stale reading must not gate today's call.
  // Stage 2 / Crisis (>=140/90) -> minimum dose. Stage 1 / Elevated (>=120) -> no grinders.
  if (latestBP) {
    const bpc = bpCategory(latestBP.sys, latestBP.dia);
    const bpAgeDays = (Date.now() - new Date(latestBP.date).getTime()) / 86400000;
    const bpFresh = bpAgeDays <= 1.0;   // reading from today (or last ~24h) only
    if (bpFresh && bpc.cls === 'red' && ORDER.indexOf(mode) > ORDER.indexOf('red_min')) {
      mode = 'red_min'; factors.push('blood pressure ' + latestBP.sys + '/' + latestBP.dia + ' (' + bpc.label + ')');
    } else if (bpFresh && bpc.cls === 'amber' && ORDER.indexOf(mode) > ORDER.indexOf('amber')) {
      mode = 'amber'; factors.push('blood pressure ' + latestBP.sys + '/' + latestBP.dia + ' (' + bpc.label + ')');
    } else if (!bpFresh && (bpc.cls === 'red' || bpc.cls === 'amber')) {
      // stale elevated reading: inform, do not gate — prompt a fresh measurement
      factors.push('last BP ' + latestBP.sys + '/' + latestBP.dia + ' (' + bpc.label + ') was ' + Math.round(bpAgeDays) + 'd ago \u2014 measure again today');
    }
  }

  const META = {
    green_push:     { title: 'Green \u00b7 Push',        cls: 'green', action: 'Full session. Push your top sets and add load wherever your targets call for it. Intensifiers on if this week programmes them.' },
    green_standard: { title: 'Green \u00b7 Standard',    cls: 'green', action: 'Full session as planned. Hit your targets with honest reps in reserve, no extra volume.' },
    amber:          { title: 'Amber \u00b7 Modify',      cls: 'amber', action: deloadWk ? 'Deload week. Keep the main lifts light, cut accessory volume, and stay well short of failure.' : 'Train, but modify. Keep your main compounds, trim one or two isolation sets, and stay a rep or two shy of failure.' },
    red_min:        { title: 'Red \u00b7 Minimum Dose',  cls: 'red',   action: 'Minimum effective dose. Run the 30-minute version, skip intensifiers, leave 2-3 in reserve, and chase a pump rather than a PR.' },
    red_stop:       { title: 'Red \u00b7 Recover',       cls: 'red',   action: "Back off today. Mobility, a walk, or easy cardio, or just rest. This mix of signals isn't the day to grind." },
  };
  const meta = META[mode];
  let action = meta.action;
  if (sharpPain && sharpName && mode === 'amber') action += ' Swap ' + sharpName + ' for a joint-friendly alternative.';
  return { mode, cls: meta.cls, title: meta.title, action, factors };
}

function bpCategory(sys, dia) {
  if (sys >= 180 || dia >= 120) return { label: 'Crisis - seek care', cls: 'red' };
  if (sys >= 140 || dia >= 90) return { label: 'High (Stage 2)', cls: 'red' };
  if (sys >= 130 || dia >= 80) return { label: 'High (Stage 1)', cls: 'amber' };
  if (sys >= 120) return { label: 'Elevated', cls: 'amber' };
  return { label: 'Normal', cls: 'green' };
}

function glucoseCategory(g) {
  // Fasting glucose in mmol/L. Thresholds: normal <5.6, impaired/watch 5.6-6.9, high >=7.0
  if (g >= 7.0) return { label: 'High - review', cls: 'red' };
  if (g >= 5.6) return { label: 'Watch (impaired fasting)', cls: 'amber' };
  if (g < 3.9) return { label: 'Low', cls: 'amber' };
  return { label: 'Normal', cls: 'green' };
}
