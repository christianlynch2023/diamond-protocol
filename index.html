<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="format-detection" content="telephone=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Diamond">
  <meta name="theme-color" content="#07090c">
  <meta name="description" content="Diamond Protocol 12-Week Hypertrophy Tracker">
  <title>Diamond Protocol</title>
  <link id="apple-icon" rel="apple-touch-icon" href="">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;touch-action:pan-x pan-y;-ms-touch-action:pan-x pan-y}
body{background:#07090c;color:#dde5ee;font-family:'Syne',sans-serif;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
:root{--bg:#07090c;--sur:#0e1319;--crd:#141b22;--bdr:#1d2733;--acc:#c4ff00;--ag:rgba(196,255,0,.12);--ag2:rgba(196,255,0,.05);--ok:#00e87a;--warn:#ff8c00;--err:#ff4444;--inf:#4a9eff;--t:#dde5ee;--t2:#7b90a8;--t3:#3c4f62}
#root{height:100%;overflow:hidden}
.app{max-width:440px;margin:0 auto;height:100dvh;background:var(--bg);position:relative;overflow:hidden;display:flex;flex-direction:column}
.screen{flex:1;overflow-y:auto;padding-bottom:calc(80px + env(safe-area-inset-bottom,0));-webkit-overflow-scrolling:touch}
.fullscreen{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-top:env(safe-area-inset-top,0);padding-bottom:env(safe-area-inset-bottom,0)}
.topbar{position:sticky;top:0;z-index:20;background:var(--bg);display:flex;align-items:center;justify-content:space-between;padding:env(safe-area-inset-top, 16px) 16px 12px;padding-top:calc(env(safe-area-inset-top, 0px) + 16px);border-bottom:1px solid var(--bdr);flex-shrink:0}
.logo{font-size:11px;font-weight:800;letter-spacing:.35em;color:var(--acc);text-transform:uppercase}
.top-badge{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;background:var(--ag);border:1px solid var(--acc);color:var(--acc)}
.phase-bar{margin:11px 15px;padding:12px 14px;border-radius:10px;border:1px solid var(--bdr);background:var(--sur);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.phase-bar.deload{border-color:rgba(255,140,0,.45);background:rgba(255,140,0,.04)}
.phase-bar.peak{border-color:rgba(196,255,0,.45);background:var(--ag2)}
.ph-name{font-size:13px;font-weight:700}
.ph-sub{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--t2);margin-top:3px}
.rir-val{font-family:'JetBrains Mono',monospace;font-size:18px;font-weight:700;color:var(--acc)}
.wksel{display:flex;align-items:center;justify-content:center;gap:20px;padding:10px 16px 4px}
.wkb{width:40px;height:40px;background:var(--crd);border:1px solid var(--bdr);color:var(--t);border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:22px;transition:all .15s;font-family:inherit;flex-shrink:0}
.wkb:hover:not(:disabled){border-color:var(--acc);color:var(--acc)}
.wkb:disabled{opacity:.18;cursor:not-allowed}
.wknum{font-family:'JetBrains Mono',monospace;font-size:54px;font-weight:700;line-height:1;letter-spacing:-.03em;text-align:center}
.wksub{font-size:9px;letter-spacing:.22em;color:var(--t3);margin-top:2px;text-align:center;text-transform:uppercase}
.grid12{display:grid;grid-template-columns:repeat(12,1fr);gap:3px;padding:6px 15px 3px}
.wc{height:24px;border-radius:4px;background:var(--crd);border:1px solid var(--bdr);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s}
.wc.cur{border-color:var(--acc);background:var(--ag2)}
.wc.all{background:rgba(0,232,122,.12);border-color:rgba(0,232,122,.35)}
.wc.part{background:rgba(196,255,0,.04);border-color:rgba(196,255,0,.2)}
.wc.dl{border-color:rgba(255,140,0,.3)}
.wc-n{font-family:'JetBrains Mono',monospace;font-size:8px;font-weight:700;color:var(--t3)}
.wc.cur .wc-n{color:var(--acc)}
.wc.all .wc-n{color:var(--ok)}
.adv-banner{margin:0 15px 8px;padding:9px 13px;background:rgba(0,232,122,.05);border:1px solid rgba(0,232,122,.3);border-radius:8px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-shrink:0}
.adv-txt{font-size:11px;color:var(--ok);flex:1}
.adv-btn{font-family:'Syne',sans-serif;font-size:11px;font-weight:800;padding:5px 11px;background:var(--ok);color:#000;border:none;border-radius:6px;cursor:pointer;white-space:nowrap}
.rec-sec{padding:7px 15px 10px;flex-shrink:0}
.sec-lbl{font-size:9px;letter-spacing:.22em;color:var(--t3);margin-bottom:5px;text-transform:uppercase}
.rec-row{display:flex;gap:6px}
.rc{flex:1;padding:7px 4px;background:var(--crd);border:1px solid var(--bdr);border-radius:6px;color:var(--t2);font-size:10px;font-weight:700;cursor:pointer;text-align:center;transition:all .15s;font-family:'Syne',sans-serif}
.rc.ok{border-color:var(--ok);color:var(--ok);background:rgba(0,232,122,.06)}
.rc.nm{border-color:var(--acc);color:var(--acc);background:var(--ag)}
.rc.bt{border-color:var(--warn);color:var(--warn);background:rgba(255,140,0,.06)}
.info-banner{margin:0 15px 8px;padding:8px 12px;border-radius:8px;font-size:11px;display:flex;align-items:center;gap:7px;flex-shrink:0}
.info-banner.warn{background:rgba(255,140,0,.05);border:1px solid rgba(255,140,0,.3);color:var(--warn)}
.info-banner.err{background:rgba(255,68,68,.05);border:1px solid rgba(255,68,68,.3);color:var(--err)}
.resume-box{margin:0 15px 10px;padding:11px 13px;background:rgba(74,158,255,.05);border:1px solid rgba(74,158,255,.3);border-radius:9px;flex-shrink:0}
.rb-title{font-size:13px;font-weight:700;color:var(--inf);margin-bottom:3px}
.rb-sub{font-size:11px;color:var(--t2);margin-bottom:8px}
.rb-btns{display:flex;gap:8px}
.rb-btn{flex:1;padding:8px;border-radius:7px;font-family:'Syne',sans-serif;font-size:11px;font-weight:700;cursor:pointer;border:1px solid var(--bdr);transition:opacity .15s}
.rb-btn.p{background:var(--inf);color:#000;border-color:var(--inf)}
.rb-btn.g{background:none;color:var(--t2)}
.sg{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 15px 16px}
.sc{background:var(--crd);border:1px solid var(--bdr);border-radius:11px;padding:13px 12px;cursor:pointer;position:relative;overflow:hidden;transition:all .2s}
.sc::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--acc);opacity:0;transition:opacity .2s}
.sc:hover::before,.sc:active::before{opacity:1}
.sc.done{border-color:rgba(0,232,122,.3)}
.sc.done::before{opacity:1;background:var(--ok)}
.s-day{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--t3);letter-spacing:.08em;margin-bottom:4px;text-transform:uppercase}
.wk-strip{display:flex;gap:4px;padding:0 15px 14px}
.wk-day{flex:1;border-radius:7px;padding:7px 2px;text-align:center;border:1px solid var(--bdr);background:var(--sur)}
.wk-day.wk-train{border-color:rgba(196,255,0,.35);background:rgba(196,255,0,.06)}
.wk-day.wk-cardio{border-color:rgba(74,158,255,.35);background:rgba(74,158,255,.06)}
.wk-day.wk-rest{opacity:.5}
.wk-dn{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--t3);letter-spacing:.05em;margin-bottom:3px}
.wk-lbl{font-size:9.5px;font-weight:600;color:var(--t);line-height:1.15}
.wk-day.wk-cardio .wk-lbl{color:#4a9eff}
.wk-day.wk-rest .wk-lbl{color:var(--t3);font-weight:400}
.s-nm{font-size:17px;font-weight:800;margin-bottom:2px;letter-spacing:-.01em}
.s-foc{font-size:10px;color:var(--t2);line-height:1.4}
.s-time{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--acc);margin-top:8px}
.s-done{position:absolute;top:9px;right:9px;width:16px;height:16px;background:var(--ok);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#000}
.back-btn{display:flex;align-items:center;gap:6px;padding:calc(env(safe-area-inset-top,0px) + 11px) 15px 3px;min-height:44px;border:none;background:none;color:var(--t2);font-size:13px;font-weight:600;cursor:pointer;font-family:'Syne',sans-serif;transition:color .15s;flex-shrink:0}
.s-hdr{padding:5px 15px 13px;border-bottom:1px solid var(--bdr);flex-shrink:0}
.s-hdr-nm{font-size:25px;font-weight:800;letter-spacing:-.01em}
.s-hdr-foc{font-size:13px;color:var(--t2);margin-top:2px}
.s-hdr-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.mp{font-family:'JetBrains Mono',monospace;font-size:10px;background:var(--sur);border:1px solid var(--bdr);color:var(--t2);padding:3px 9px;border-radius:20px}
.mp.acc{color:var(--acc);border-color:rgba(196,255,0,.35);background:var(--ag2)}
.mp.warn{color:var(--warn);border-color:rgba(255,140,0,.35)}
.int-ctrl{display:flex;align-items:center;justify-content:space-between;padding:8px 15px;border-bottom:1px solid var(--bdr);background:var(--sur);flex-shrink:0}
.int-ctrl-lbl{font-size:11px;font-weight:700;color:var(--t2)}
.int-count{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;color:var(--acc)}
.int-count.full{color:var(--ok)}
.ex-list{padding:8px 15px}
.ex-row{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--bdr)}
.ex-row:last-child{border-bottom:none}
.ex-n{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--t3);min-width:20px;padding-top:1px}
.ex-body{flex:1}
.ex-nm{font-size:14px;font-weight:700;margin-bottom:4px}
.ex-nm.opt{color:var(--t2)}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font-family:'JetBrains Mono',monospace;font-size:10px;padding:2px 7px;border-radius:4px;background:var(--sur);border:1px solid var(--bdr);color:var(--t2)}
.chip.rir{color:var(--acc);border-color:rgba(196,255,0,.3);background:var(--ag2)}
.chip.avd{color:var(--err);border-color:rgba(255,68,68,.3);background:rgba(255,68,68,.05);margin-top:3px;display:inline-block}
.chip.dl{color:var(--warn);border-color:rgba(255,140,0,.3)}
.int-tog-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:5px}
.int-tog-desc{font-size:10px;color:var(--t2);flex:1;line-height:1.4}
.int-tog{font-family:'JetBrains Mono',monospace;font-size:9px;padding:3px 8px;border-radius:4px;border:1px solid rgba(196,255,0,.3);background:var(--ag2);color:var(--acc);cursor:pointer;transition:all .15s;white-space:nowrap;font-weight:700;letter-spacing:.06em}
.int-tog.on{background:var(--acc);color:#000;border-color:var(--acc)}
.int-tog:disabled{opacity:.3;cursor:not-allowed}
.start-btn{display:block;margin:2px 15px 16px;width:calc(100% - 30px);padding:14px;background:var(--acc);color:#000;font-family:'Syne',sans-serif;font-size:14px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;border:none;border-radius:10px;cursor:pointer;transition:all .15s;flex-shrink:0}
.prog-rec{margin:9px 15px 0;padding:9px 12px;border-radius:8px;font-size:11px;font-weight:600;display:flex;align-items:center;gap:7px;flex-shrink:0}
.prog-rec.inc{background:rgba(0,232,122,.07);border:1px solid rgba(0,232,122,.3);color:var(--ok)}
.prog-rec.beat{background:var(--ag2);border:1px solid rgba(196,255,0,.25);color:var(--acc)}
.prog-rec.keep{background:var(--sur);border:1px solid var(--bdr);color:var(--t2)}
.prog-rec.first{background:rgba(74,158,255,.06);border:1px solid rgba(74,158,255,.25);color:var(--inf)}
.wk-prog{height:2px;background:var(--bdr);flex-shrink:0}
.wk-prog-fill{height:100%;background:var(--acc);transition:width .5s ease}
.wk-top{display:flex;align-items:center;justify-content:space-between;padding:10px 15px;border-bottom:1px solid var(--bdr);background:var(--bg);flex-shrink:0}
.wk-sn{font-size:10px;font-weight:700;letter-spacing:.14em;color:var(--t2);text-transform:uppercase}
.wk-cnt{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--t3)}
.ex-card{margin:9px 15px;background:var(--crd);border:1px solid var(--bdr);border-radius:12px;overflow:hidden}
.ec-hdr{padding:11px 13px 8px;border-bottom:1px solid var(--bdr)}
.ec-nm{font-size:19px;font-weight:800;margin-bottom:5px;letter-spacing:-.01em}
.ec-meta{display:flex;flex-wrap:wrap;gap:4px}
.ec-cues{padding:7px 13px;border-bottom:1px solid var(--bdr);display:flex;flex-wrap:wrap;gap:4px}
.cue{font-size:10px;color:var(--t2);background:var(--sur);padding:2px 8px;border-radius:20px}
.int-box{margin:7px 13px;padding:8px 11px;background:var(--ag2);border:1px solid rgba(196,255,0,.2);border-radius:8px}
.int-lbl{font-family:'JetBrains Mono',monospace;font-size:9px;font-weight:700;color:var(--acc);letter-spacing:.14em;margin-bottom:2px;text-transform:uppercase}
.int-txt{font-size:12px;color:var(--t2)}
.avd-box{margin:5px 13px;padding:6px 10px;background:rgba(255,68,68,.04);border:1px solid rgba(255,68,68,.2);border-radius:7px;font-size:11px;color:rgba(255,68,68,.85)}
.set-trk{padding:9px 13px;border-bottom:1px solid var(--bdr)}
.stl{font-size:9px;letter-spacing:.18em;color:var(--t3);margin-bottom:6px;text-transform:uppercase;display:flex;align-items:center;justify-content:space-between}
.dots{display:flex;gap:5px}
.dot{flex:1;height:3px;border-radius:2px;background:var(--bdr);transition:all .25s}
.dot.d{background:var(--ok)}
.dot.c{background:var(--acc);box-shadow:0 0 5px var(--acc)}
.logged-sets{padding:6px 13px;border-bottom:1px solid var(--bdr);display:flex;flex-wrap:wrap;gap:4px;min-height:32px}
.ls-chip{font-family:'JetBrains Mono',monospace;font-size:10px;padding:3px 8px;background:var(--sur);border:1px solid var(--bdr);border-radius:5px;color:var(--t2);cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:4px}
.ls-chip.ed{border-color:var(--acc);background:var(--ag);color:var(--acc)}
.ls-rir{font-size:8px;color:var(--t3)}
.prev-sec{padding:6px 13px;border-bottom:1px solid var(--bdr)}
.prev-lbl{font-size:9px;letter-spacing:.15em;color:var(--t3);margin-bottom:3px;text-transform:uppercase}
.prev-item{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--t2);display:flex;gap:5px;margin-bottom:2px;align-items:center}
.prev-dt{color:var(--t3);min-width:55px;font-size:9px}
.prev-prog{color:var(--acc);font-size:9px}
.inp-sec{padding:10px 13px;border-bottom:1px solid var(--bdr)}
.inp-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.inp-grp{display:flex;flex-direction:column;gap:4px}
.inp-lbl{font-size:9px;letter-spacing:.2em;color:var(--t3);text-transform:uppercase}
.nw{display:flex;align-items:center;background:var(--sur);border:1px solid var(--bdr);border-radius:8px;height:48px;overflow:hidden;transition:border-color .15s}
.nw:focus-within{border-color:rgba(196,255,0,.4)}
.nb{width:40px;height:100%;background:none;border:none;color:var(--t2);cursor:pointer;font-size:20px;display:flex;align-items:center;justify-content:center;transition:color .15s;font-family:inherit}
.nb:hover{color:var(--acc)}
.ni{flex:1;background:none;border:none;color:var(--t);font-family:'JetBrains Mono',monospace;font-size:20px;font-weight:700;text-align:center;outline:none;width:0;-moz-appearance:textfield}
.ni::-webkit-outer-spin-button,.ni::-webkit-inner-spin-button{-webkit-appearance:none}
.rir-grp{display:flex;flex-direction:column;gap:4px}
.rir-row{display:flex;gap:4px}
.rirb{flex:1;height:48px;background:var(--sur);border:1px solid var(--bdr);border-radius:8px;color:var(--t2);font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:700;cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:center}
.rirb:hover{border-color:var(--acc);color:var(--acc)}
.rirb.on{background:var(--acc);color:#000;border-color:var(--acc)}
.log-area{padding:0 13px 10px}
.log-btn{display:block;width:100%;padding:13px;background:var(--acc);color:#000;font-family:'Syne',sans-serif;font-size:13px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;border:none;border-radius:8px;cursor:pointer;transition:all .15s}
.log-btn.upd{background:var(--inf)}
.onerm-box{margin:6px 13px 0;padding:7px 11px;background:rgba(74,158,255,.05);border:1px solid rgba(74,158,255,.2);border-radius:7px;display:flex;align-items:center;justify-content:space-between}
.orm-lbl{font-size:11px;color:var(--t2)}
.orm-val{font-family:'JetBrains Mono',monospace;font-size:16px;font-weight:700;color:var(--inf)}
.wk-nav{display:flex;gap:8px;padding:0 15px 16px;flex-shrink:0}
.wnb{flex:1;padding:11px;background:none;border:1px solid var(--bdr);color:var(--t2);font-family:'Syne',sans-serif;font-size:11px;font-weight:700;border-radius:8px;cursor:pointer;transition:all .15s}
.wnb.fin{color:var(--err)}
.wnb:disabled{opacity:.4;cursor:default}
.timer-ov{position:fixed;inset:0;background:rgba(7,9,12,.97);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:300}
.t-lbl{font-size:10px;letter-spacing:.3em;color:var(--t2);margin-bottom:18px;text-transform:uppercase}
.t-ring{position:relative;width:200px;height:200px}
.t-ring svg{transform:rotate(-90deg)}
.t-track{fill:none;stroke:var(--bdr);stroke-width:10}
.t-fill{fill:none;stroke:var(--acc);stroke-width:10;stroke-linecap:round;filter:drop-shadow(0 0 8px var(--acc));transition:stroke-dashoffset .08s linear}
.t-ctr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.t-secs{font-family:'JetBrains Mono',monospace;font-size:54px;font-weight:700;line-height:1;letter-spacing:-.03em}
.t-unit{font-size:9px;letter-spacing:.25em;color:var(--t2);margin-top:3px;text-transform:uppercase}
.t-msg{margin-top:18px;font-size:12px;color:var(--t2);text-align:center}
.t-skip{margin-top:16px;padding:11px 36px;background:var(--crd);border:1px solid var(--bdr);color:var(--t);font-family:'Syne',sans-serif;font-size:14px;font-weight:700;border-radius:8px;cursor:pointer;transition:all .15s;letter-spacing:.04em}
.t-skip:hover{border-color:var(--acc);color:var(--acc)}
.modal-ov{position:fixed;inset:0;background:rgba(7,9,12,.88);display:flex;align-items:center;justify-content:center;z-index:400;padding:20px}
.modal{background:var(--crd);border:1px solid var(--bdr);border-radius:14px;padding:22px;width:100%;max-width:360px}
.modal-title{font-size:18px;font-weight:800;margin-bottom:7px}
.modal-sub{font-size:13px;color:var(--t2);margin-bottom:18px;line-height:1.5}
.modal-btns{display:flex;gap:8px}
.mbt{flex:1;padding:12px;border-radius:8px;font-family:'Syne',sans-serif;font-size:12px;font-weight:700;cursor:pointer;border:1px solid var(--bdr);transition:opacity .15s}
.mbt:hover{opacity:.85}
.mbt.danger{background:rgba(255,68,68,.08);color:var(--err);border-color:rgba(255,68,68,.3)}
.mbt.ghost{background:none;color:var(--t2)}
.done-view{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100dvh;padding:calc(env(safe-area-inset-top,0px) + 30px) 20px calc(env(safe-area-inset-bottom,0px) + 30px);text-align:center;overflow-y:auto}
.done-icon{font-size:56px;margin-bottom:14px}
.done-title{font-size:28px;font-weight:800;letter-spacing:-.01em;margin-bottom:4px}
.done-sub{font-size:14px;color:var(--t2);margin-bottom:20px}
.done-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%;max-width:290px;margin-bottom:18px}
.done-stat{background:var(--crd);border:1px solid var(--bdr);border-radius:10px;padding:12px;text-align:center}

// Theil-Sen slope: the median of every pairwise slope. Ordinary least-squares is yanked by a
// water-high day sitting at the START or END of the window (a window that happens to open on
// a spike tilts the whole fit — the +0.68 kg/wk artefact). Theil-Sen ignores up to ~29% of
// points being outliers on either edge, so the trend reflects the real body of the data.
// Direction-invariant: (wj-wi)/(tj-ti) is the same regardless of point order, so callers may
// pass points in any order; only zero-time-gap pairs are skipped.
function theilSenSlope(pts) {
  const slopes = [];
  for (let i = 0; i < pts.length; i++) {
    for (let j = i + 1; j < pts.length; j++) {
      const dt = pts[j].t - pts[i].t;
      if (dt !== 0) slopes.push((pts[j].w - pts[i].w) / dt);
    }
  }
  if (!slopes.length) return null;
  slopes.sort((a, b) => a - b);
  const m = Math.floor(slopes.length / 2);
  return slopes.length % 2 ? slopes[m] : (slopes[m - 1] + slopes[m]) / 2;
}

// Volume-load (tonnage) for a set array: sum of weight x reps, in kg.

// "total work done", not "did I get stronger".

// Strict numeric parser for user input at write boundaries.
// Returns a finite number, or null if the input is empty/blank/non-numeric/non-finite.

const localToday = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
const RAMP_EX = new Set(['ua3','ua4','ua5','ub3','ub1','ub4','ub5']);

function calcPlates(target, bar=20) {
  const avail = [25,20,15,10,5,2.5,1.25];
  const perSide = (target - bar) / 2;
  if (perSide < 0) return {ok:false, plates:[]};
  let rem = perSide; const plates = [];
  for (const p of avail) { const n=Math.floor(rem/p+0.001); if(n>0){plates.push({kg:p,count:n});rem-=n*p;} }
  return {ok:rem<0.1, plates};
}

function calcWarmups(working) {
  if (!working || working <= 20) return [];
  const res = [{wt:20,reps:10,pct:"Bar"}];
  const pcts = working<=60?[0.5,0.75]:working<=100?[0.5,0.65,0.8]:[0.4,0.55,0.7,0.85];
  for (const p of pcts) { const w=Math.round(working*p/2.5)*2.5; res.push({wt:w,reps:p>=0.8?1:p>=0.65?2:4,pct:`${Math.round(p*100)}%`}); }
  return res;
}

// Substituted exercises are logged under a generated id (sub_<baseId>_<name>) which is NOT

function exMuscle(ex) { return EX_MUSCLE[ex.origId || ex.id] || EX_MUSCLE[ex.id]; }

  const v = {};

    if (block != null && (l.block||1) !== block) continue;
    for (const ex of (l.exercises || [])) {
      const m = exMuscle(ex); if (!m) continue;
      const sets = ex.sets?.length || 0;
      v[m.p] = (v[m.p] || 0) + sets;
      if (m.s) { const ss=Array.isArray(m.s)?m.s:[m.s]; for(const sm of ss) v[sm]=(v[sm]||0)+sets*0.5; }
    }
  }

}
function weeklyVolumeSeries(logs, muscle, block) {
  const byWeek = {};

    if (block != null && (l.block||1) !== block) continue;
    for (const ex of (l.exercises || [])) {
      const m = exMuscle(ex); if (!m) continue;
      const sets = ex.sets?.length || 0;
      if (muscle === 'all') { byWeek[l.week] = (byWeek[l.week] || 0) + sets; }
      else { let add = 0; if (m.p === muscle) add += sets; if (m.s) { const ss=Array.isArray(m.s)?m.s:[m.s]; if(ss.includes(muscle)) add += sets * 0.5; } if (add) byWeek[l.week] = (byWeek[l.week] || 0) + add; }
    }

  return weeks.map(w => ({ x: 'W' + w, y: Math.round(byWeek[w] * 10) / 10 }));

function getProgRec(exId, rMax, logs, phase) {
  for (const s of logs) {
    const ex = s.exercises?.find(e => e.id === exId);
    if (!ex?.sets?.length) continue;
    const top = Math.max(...ex.sets.map(s => s.weight));
    if (ex.sets.every(s => s.reps >= rMax)) return phase==='cut' ? {type:"hold", msg:"Cut — hold load, keep the reps", wt:top} : {type:"inc", msg:`All sets hit ${rMax} reps — increase weight`, wt:top};
    if (ex.sets.some(s => s.reps >= rMax)) return {type:"beat", msg:"Beat weaker sets, keep weight", wt:top};
    return {type:"keep", msg:"Keep weight, beat reps", wt:top};
  }

}

function getPrevHist(exId, logs, limit=3) {
  const res = [];
  for (const s of logs) {
    // Match either the exercise actually logged under this ID, or one that was
    // swapped FROM this ID (origId) — so a substitution doesn't create a blind
    // spot in "previous sessions" for the originally-planned exercise.
    const ex = s.exercises?.find(e => e.id === exId || e.origId === exId);
    if (ex?.sets?.length) { res.push({date:s.date, sets:ex.sets, week:s.week, swapped: ex.id!==exId ? ex.name : null}); if(res.length>=limit) break; }
  }

function getIncrement(ex) {
  const n = (ex.name || '').toLowerCase();
  if (n.includes('pull-up') || n.includes('chin')) return 1.25;
  if (n.includes('db ') || n.includes('dumbbell')) return 2;
  if (/(lateral|fly|crunch|curl|ext|raise|face pull|adductor|pulldown|cross)/.test(n)) return 1;
  return 2.5;
}
function getTarget(ex, logs, week, phase, histId, dl = (_deloadNow == null ? DLW.has(week) : _deloadNow)) {

  // inherited the base exercise's loads (e.g. machine press targeted at RO-T8 weights).
  const _hid = histId || ex.id;
  const prev = getPrevHist(_hid, logs, 1)[0];
  if (!prev) return { weight: 0, reps: ex.rMin, note: 'First time — establish a working weight', first: true };
  const topWeight = Math.max(...prev.sets.map(s => s.weight));
  const rec = getProgRec(_hid, ex.rMax, logs, phase);
  const incr = getIncrement(ex);
  if (dl) {
    return { weight: Math.round((topWeight * 0.85) / 2.5) * 2.5, reps: Math.round((ex.rMin + ex.rMax) / 2), note: 'Deload — keep several reps in reserve' };
  }
  if (phase === 'cut' && rec.type !== 'inc') {
    return { weight: topWeight, reps: ex.rMax, note: 'Cut — hold load, retain muscle' };
  }
  if (rec.type === 'inc') {
    return { weight: topWeight + incr, reps: ex.rMin, note: 'Up ' + incr + 'kg — you hit top reps last time' };
  }
  if (rec.type === 'beat') {
    return { weight: topWeight, reps: ex.rMax, note: 'Same weight — some sets hit target, beat the weaker ones' };
  }

}

let _audioCtx = null;
function getAudioCtx() {

    if (_audioCtx.state === 'suspended') _audioCtx.resume();
    return _audioCtx;
  } catch(e) { return null; }
}
// Call on a user gesture (e.g. starting a set) to unlock audio on iOS.

  const ctx = getAudioCtx();

  try {
    const o=ctx.createOscillator(), g=ctx.createGain();
    g.gain.value=0; o.connect(g); g.connect(ctx.destination);
    o.start(); o.stop(ctx.currentTime+0.01);
  } catch(e) {}
}
function vibrate(pattern) {

}

  vibrate([120, 80, 120, 80, 200]);

  if (!ctx) return;
  try {
    if (ctx.state === 'suspended') ctx.resume();

      const o=ctx.createOscillator(), g=ctx.createGain();
      o.connect(g); g.connect(ctx.destination); o.frequency.value=freq; o.type='sine';

      g.gain.exponentialRampToValueAtTime(.001, ctx.currentTime+delay+.45);
      o.start(ctx.currentTime+delay); o.stop(ctx.currentTime+delay+.5);
    });
  } catch(e) {}
}

function RecoveryFuelStrip({ rows, height=150 }) {
  // rows: [{date, recovery, kcal, carbs, sleepH}] oldest->newest
  if (!rows || rows.length < 3) return <div style={{height,display:'flex',alignItems:'center',justifyContent:'center',color:'var(--t3)',fontSize:12,textAlign:'center'}}>Need 3+ days with both WHOOP and logged nutrition to show the overlay</div>;
  const W=Math.max(rows.length*30, 300), barH=height-46, pad=4;
  const kcals=rows.map(r=>r.kcal).filter(v=>v!=null);
  const maxKcal=kcals.length?Math.max(...kcals):1, minKcal=kcals.length?Math.min(...kcals):0;
  const range=Math.max(maxKcal-minKcal,1);
  const colW=(W-pad*2)/rows.length;
  // recovery line points (0-100 mapped to barH)
  const pts=rows.map((r,i)=>{
    const x=pad+colW*i+colW/2;
    const y=r.recovery!=null ? (barH - (r.recovery/100)*barH) : null;
    return {x,y,r};
  });
  const line=pts.filter(p=>p.y!=null).map((p,i)=>`${i===0?'M':'L'}${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');
  const recColor=r=>r>=67?'#00e87a':r>=34?'#f0c020':'#ff6b6b';
  return (
    <div style={{overflowX:'auto'}}>
      <svg width={W} height={height} style={{display:'block'}}>
        {rows.map((r,i)=>{
          const x=pad+colW*i;
          const kh=r.kcal!=null ? Math.max(((r.kcal-minKcal)/range)*(barH*0.7)+6, 6) : 0;
          return (
            <g key={i}>
              {r.kcal!=null && <rect x={x+colW*0.2} y={barH-kh} width={colW*0.6} height={kh} rx={2} fill="rgba(74,158,255,.32)"/>}
              <text x={x+colW/2} y={height-26} fontSize="8" fill="var(--t3)" textAnchor="middle">{r.kcal!=null?Math.round(r.kcal/100)/10+'k':''}</text>
              <text x={x+colW/2} y={height-14} fontSize="8" fill="var(--t3)" textAnchor="middle">{r.date.slice(5)}</text>
              {r.sleepH!=null && <text x={x+colW/2} y={height-2} fontSize="7.5" fill="var(--t3)" textAnchor="middle">{r.sleepH}h</text>}
            </g>
          );
        })}
        {line && <path d={line} fill="none" stroke="#00e87a" strokeWidth="2"/>}
        {pts.filter(p=>p.y!=null).map((p,i)=>(<circle key={i} cx={p.x} cy={p.y} r="3.5" fill={recColor(p.r.recovery)}/>))}
      </svg>
    </div>

}

function Sparkline({ vals, color='#4a9eff', w=54, h=18 }) {
  const nums = (vals||[]).filter(v=>typeof v==='number'&&isFinite(v));
  if (nums.length < 2) return <svg width={w} height={h}/>;
  const min=Math.min(...nums), max=Math.max(...nums), rng=(max-min)||1;
  const pts=nums.map((v,i)=>`${(i/(nums.length-1))*w},${h-((v-min)/rng)*h}`).join(' ');
  return <svg width={w} height={h} style={{display:'block'}}><polyline points={pts} fill="none" stroke={color} strokeWidth="1.5" strokeLinejoin="round" strokeLinecap="round"/></svg>;
}
function SVGChart({ data, color='#c4ff00', height=130 }) {
  // Defense-in-depth: drop any points with non-finite y (NaN/Infinity) before plotting.
  // Protects against legacy localStorage data corrupted before input validation existed,
  // so a single bad value can never produce a broken "M NaN,NaN" path or blank chart.
  data = (data || []).filter(d => d && Number.isFinite(d.y));
  if (!data || data.length < 2) return <div style={{height,display:'flex',alignItems:'center',justifyContent:'center',color:'var(--t3)',fontSize:12}}>Need more sessions to show chart</div>;
  const vals = data.map(d => d.y);
  const maxV = Math.max(...vals), minV = Math.min(...vals);
  const range = maxV - minV || 1;
  const W=320, H=height, PX=36, PY=14, iW=W-PX*2, iH=H-PY*2;
  const tx = i => PX + (i/(data.length-1))*iW;
  const ty = v => H-PY-((v-minV)/range)*iH;
  const pts = data.map((d,i) => [tx(i), ty(d.y)]);
  const line = pts.map((p,i) => `${i===0?'M':'L'}${p[0].toFixed(1)} ${p[1].toFixed(1)}`).join(' ');
  const area = line + ` L${pts[pts.length-1][0].toFixed(1)} ${H-PY} L${PX} ${H-PY} Z`;
  const yTicks = [0,0.5,1].map(t => ({v: minV+t*range, y: ty(minV+t*range)}));
  const step = Math.ceil(data.length/4);
  const xLabels = data.filter((_,i) => i===0 || i===data.length-1 || i%step===0);
  return (
    <svg viewBox={`0 0 ${W} ${H}`} style={{width:'100%',display:'block'}}>
      <defs>
        <linearGradient id="cg" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor={color} stopOpacity="0.22"/>
          <stop offset="100%" stopColor={color} stopOpacity="0"/>
        </linearGradient>
      </defs>
      {yTicks.map((t,i) => (
        <g key={i}>
          <line x1={PX} y1={t.y} x2={W-PX} y2={t.y} stroke="#1d2733" strokeWidth="1" strokeDasharray="3 3"/>
          <text x={PX-5} y={t.y+3} textAnchor="end" fontSize="9" fill="#3c4f62" fontFamily="JetBrains Mono">{Math.round(t.v)}</text>
        </g>
      ))}
      {xLabels.map((d,i) => {
        const idx = data.indexOf(d);
        return <text key={i} x={tx(idx)} y={H-2} textAnchor="middle" fontSize="9" fill="#3c4f62" fontFamily="JetBrains Mono">{d.x}</text>;
      })}
      <path d={area} fill="url(#cg)"/>
      <path d={line} fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>
      {pts.map((p,i) => <circle key={i} cx={p[0]} cy={p[1]} r="3" fill={color}/>)}
    </svg>
  );
}

// Parse ALL cycle records, keeping only COMPLETED cycles (those with an end timestamp).
// The in-progress cycle's kilojoule field is a running total — reading it mid-morning and
// storing it as the day's expenditure is what produced the systematically-low ~1,500 kcal
// "avg out". A completed cycle carries the true full-day burn.
function parseWhoopCycles(raw) {
  const records = raw?.records || raw?.data || [];
  const localDay = ts => { const d = new Date(ts); return isNaN(d) ? null : `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
  return records.map(c => {
    const s = c.score || c;
    const end = c.end || c.during?.upper || null;
    if (!end) return null;                    // in-progress cycle — never trust its total
    const date = localDay(c.start || c.during?.lower || end);
    if (!date) return null;
    const kcal = s.kilojoule != null ? Math.round(s.kilojoule / 4.184) : null;
    if (kcal == null || kcal <= 0) return null;
    return { date, dayCal: kcal, dayCalFinal: true, strain: s.strain != null ? Math.round(s.strain*10)/10 : null };
  }).filter(Boolean);
}

function parseWhoopHistory(rec) {
  const records = rec?.records || rec?.data || [];
  return records.map(r => {
    const s = r.score || r;
    const date = (r.created_at || r.updated_at || '').slice(0, 10);
    if (!date) return null;
    return {
      date,
      recovery: Math.round(s.recovery_score ?? 0) || null,
      hrv: Math.round(s.hrv_rmssd_milli ?? s.hrv ?? 0) || null,
      rhr: Math.round(s.resting_heart_rate ?? 0) || null,
    };
  }).filter(x => x && x.recovery != null);
}
function mergeHistory(a, b) {
  const map = {};
  // Field-level merge: a later entry must not wipe fields it simply doesn't carry
  // (e.g. parseWhoopHistory has no dayCal; a wholesale replace would erase it).
  [...(a || []), ...(b || [])].forEach(e => {
    if (!e || !e.date) return;
    const prev = map[e.date] || {};
    const merged = { ...prev };
    Object.keys(e).forEach(k => { if (e[k] != null) merged[k] = e[k]; });
    map[e.date] = merged;
  });
  return Object.values(map).sort((x, y) => x.date < y.date ? -1 : 1).slice(-60);
}
function computeDeloadReadiness(history, week) {
  if (!history || history.length < 6) return { level: 'unknown', msg: 'Need about a week of WHOOP data to assess fatigue.' };
  const sorted = [...history].sort((x, y) => x.date < y.date ? -1 : 1);
  const recent = sorted.slice(-7);
  const base = sorted.length >= 14 ? sorted.slice(-14, -7) : sorted.slice(0, -7);
  const avg = (arr, k) => { const v = arr.map(e => e[k]).filter(n => n != null); return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null; };
  const rRec = avg(recent, 'recovery'), bRec = avg(base, 'recovery');
  const rHrv = avg(recent, 'hrv'), bHrv = avg(base, 'hrv');
  let signals = 0; const reasons = [];
  if (rRec != null && bRec != null && (rRec - bRec) <= -8) { signals++; reasons.push('recovery down ' + Math.round(bRec - rRec) + ' pts'); }
  if (rHrv != null && bHrv != null && ((rHrv - bHrv) / bHrv * 100) <= -10) { signals++; reasons.push('HRV down ' + Math.round((bHrv - rHrv) / bHrv * 100) + '%'); }
  if (rRec != null && rRec < 40) { signals++; reasons.push('recovery sitting low'); }
  const endOfBlock = [3, 7, 11].includes(week);
  // Today's recovery is the strongest single signal. If the most recent recovery is solidly
  // green (>=67), don't raise a deload/fatigue flag off trend deltas alone - on tren, HRV/RHR
  // run chronically suppressed so the baseline comparison produces false fatigue signals.
  const latestRec = sorted.length ? sorted[sorted.length-1].recovery : null;
  const greenNow = latestRec != null && latestRec >= 67;
  let level, msg;
  if (signals >= 2 && !greenNow) { level = 'deload'; msg = 'Fatigue is accumulating (' + reasons.join(', ') + '). Consider a deload or cut volume 30-40% this week.'; }
  else if (signals === 1 && !greenNow) { level = 'moderate'; msg = 'Early fatigue signal (' + reasons.join(', ') + '). Hold volume, prioritise sleep, and watch your performance.'; }
  else { level = 'fresh'; msg = endOfBlock ? 'Recovery is holding well — you could push one more hard week before deloading.' : 'Recovery is holding well — keep progressing as planned.'; }
  if (endOfBlock && level === 'moderate' && !greenNow) { level = 'deload'; msg = 'End of an accumulation block and ' + reasons.join(', ') + ' — a deload is well timed now.'; }
  return { level, msg, rRec: rRec != null ? Math.round(rRec) : null, bRec: bRec != null ? Math.round(bRec) : null, rHrv: rHrv != null ? Math.round(rHrv) : null, bHrv: bHrv != null ? Math.round(bHrv) : null };
}

function parseWhoopWorkouts(raw) {
  const records = raw?.records || raw?.data || [];
  return records.map(w => {
    const s = w.score || w;
    return {
      start: w.start || w.during?.lower || null,
      end: w.end || w.during?.upper || w.start || null,
      strain: s.strain != null ? Math.round(s.strain * 10) / 10 : null,
      avgHr: s.average_heart_rate != null ? Math.round(s.average_heart_rate) : null,
      maxHr: s.max_heart_rate != null ? Math.round(s.max_heart_rate) : null,
      kcal: s.kilojoule != null ? Math.round(s.kilojoule / 4.184) : null,
    };
  }).filter(w => w.start && w.strain != null);
}
function matchWorkout(log, workouts) {
  if (!workouts || !workouts.length || !log.date) return null;
  const end = new Date(log.date).getTime();
  const start = end - (log.duration || 60) * 60000;
  let best = null, bestOv = 0;
  for (const w of workouts) {
    const ws = new Date(w.start).getTime(), we = new Date(w.end || w.start).getTime();
    const ov = Math.min(end, we) - Math.max(start, ws);
    if (ov > bestOv) { bestOv = ov; best = w; }
  }
  return bestOv > 5 * 60000 ? best : null;
}

const ORM_IDS = (() => { const s=new Set(); for(const k in SESSIONS) for(const e of SESSIONS[k].exercises) if(e.orm) s.add(e.id); return s; })();
function detectPlateaus(logs) {

      if (!ex.sets?.length) continue;
      const _pid = ex.origId || ex.id;
      if (!ORM_IDS.has(_pid)) continue;
      const best = Math.max(...ex.sets.map(s => epley(s.weight, s.reps)));
      (byEx[_pid] = byEx[_pid] || { name: ex.name, vals: [] }).vals.push(best);
    }
  }
  const stalled = [];
  for (const id in byEx) {
    const v = byEx[id].vals;
    if (v.length < 4) continue;
    const peak = Math.max(...v);
    let stuck = 0;
    for (const x of v) { if (x >= peak - 0.001) break; stuck++; }
    if (stuck >= 3) stalled.push({ name: byEx[id].name, sessions: stuck, lastE1rm: Math.round(v[0]), peakE1rm: Math.round(peak) });
  }
  return stalled.sort((a, b) => b.sessions - a.sessions);
}

// ---- Strength-retention index (the cut KPI) ----
// For each `orm` compound: compare best e1RM in the trailing 21 days vs the 21 days before
// that. Average the %Δ across lifts with data in BOTH windows. Read alongside the weight
// trend: weight down + e1RM held/up = fat loss; both down = losing muscle, deficit too steep.
function computeStrengthRetention(logs) {
  const dayMs=86400000, nowTs=Date.now();
  const recentStart=nowTs-21*dayMs, priorStart=nowTs-42*dayMs;
  const byEx={};
  for (const l of logs) {
    const t=new Date(l.date).getTime();
    if (isNaN(t) || t<priorStart || t>nowTs) continue;
    // Skip deload sessions: an 85%-load week would read as strength loss that isn't real.
    // Tagged logs carry l.deload; legacy logs fall back to the scheduled-deload weeks.
    if (l.deload === true) continue;
    if (l.deload == null && DLW.has(l.week)) continue;
    const win = t>=recentStart ? 'recent' : 'prior';
    for (const ex of (l.exercises||[])) {
      if (!ex.sets || !ex.sets.length) continue;
      const pid=ex.origId||ex.id;
      if (!ORM_IDS.has(pid)) continue;
      const best=Math.max(...ex.sets.map(s=>epley(s.weight||0,s.reps||0)));
      if (!best || !isFinite(best)) continue;
      const rec=(byEx[pid]=byEx[pid]||{name:ex.name,recent:0,prior:0});
      if (best>rec[win]) rec[win]=best;
    }
  }
  const lifts=[];
  for (const id in byEx) {
    const r=byEx[id];
    if (r.recent>0 && r.prior>0) lifts.push({name:r.name, pct:+(((r.recent-r.prior)/r.prior)*100).toFixed(1), recent:Math.round(r.recent), prior:Math.round(r.prior)});
  }
  if (!lifts.length) return null;
  const avgPct=+(lifts.reduce((a,l)=>a+l.pct,0)/lifts.length).toFixed(1);
  return { avgPct, lifts: lifts.sort((a,b)=>a.pct-b.pct) };
}

// ---- Context flags: attribution, not just logging ----
// A recovery dip that follows alcohol, illness or a bad night is TRANSIENT and must not be
// read as accumulated training fatigue. Returns the flag relevant to today's readiness.
const CTX_TAGS = [
  {id:'illness', label:'Illness'},
  {id:'poorsleep', label:'Bad night'},
  {id:'travel', label:'Travel'},
  {id:'stress', label:'High stress'},
];
function ctxForDate(contextLog, dateStr) {
  return (contextLog||[]).find(c => (c.date||'').slice(0,10) === dateStr) || null;
}
// Alcohol suppresses REM and drops HRV for 24-48h, so yesterday counts as well as today.
function recentCtx(contextLog) {
  const d = new Date();
  const day = n => { const x=new Date(d); x.setDate(x.getDate()-n); return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`; };
  const today = ctxForDate(contextLog, day(0)), yest = ctxForDate(contextLog, day(1));
  const reasons = [];
  const pick = (c, when) => {
    if (!c) return;
    if (c.units > 0) reasons.push(`alcohol ${c.units}u ${when}`);
    (c.tags||[]).forEach(t => { const m=CTX_TAGS.find(x=>x.id===t); if(m) reasons.push(m.label.toLowerCase()+' '+when); });
  };
  pick(today, 'today'); pick(yest, 'yesterday');
  return reasons.length ? reasons : null;
}

// ---- Deload rebound: does a deload actually pay off for THIS athlete? ----
// Compares best e1RM on tracked compounds in the 7 days AFTER a deload week against the 7
// days BEFORE it. Positive = the deload bought you strength. Repeatedly negative/flat means
// deloads are costing you a week — real evidence for the take-vs-train-through decision.
function computeDeloadRebound(logs) {
  const isDeloadLog = l => l.deload === true || (l.deload == null && DLW.has(l.week));
  const deloadWeeks = {};
  for (const l of logs) { if (isDeloadLog(l)) { const k=(l.block||1)+'-'+l.week; deloadWeeks[k]={block:l.block||1, week:l.week}; } }
  const best = (arr) => {
    let b = 0;
    for (const l of arr) for (const ex of (l.exercises||[])) {
      if (!ex.sets || !ex.sets.length) continue;
      if (!ORM_IDS.has(ex.origId||ex.id)) continue;
      const e=Math.max(...ex.sets.map(s=>epley(s.weight||0,s.reps||0)));
      if (e>b) b=e;
    }
    return b;
  };
  const out = [];
  for (const k in deloadWeeks) {
    const { block, week } = deloadWeeks[k];
    const before = logs.filter(l => (l.block||1)===block && l.week===week-1 && !isDeloadLog(l));
    const after  = logs.filter(l => (l.block||1)===block && l.week===week+1 && !isDeloadLog(l));
    if (!before.length || !after.length) continue;
    const b=best(before), a=best(after);
    if (!b || !a) continue;
    out.push({ block, week, pct:+(((a-b)/b)*100).toFixed(1), before:Math.round(b), after:Math.round(a) });
  }
  if (!out.length) return null;
  const avg=+(out.reduce((s,o)=>s+o.pct,0)/out.length).toFixed(1);
  return { avg, events: out.sort((x,y)=> (y.block-x.block)||(y.week-x.week)) };
}

// ---- RIR drift: are logged reps-in-reserve matching the prescription? ----
// Positive drift = logging easier than prescribed (sandbagging, or accepting a wrong
// default). Negative = training harder than programmed, a creeping-overreach signal.
function computeRirDrift(logs, block) {
  const byWeek = {};
  for (const l of logs) {
    if ((l.block||1) !== block) continue;
    const dl = l.deload === true || (l.deload == null && DLW.has(l.week));
    const target = effWR(l.week, dl).rirN;
    if (target == null) continue;
    for (const ex of (l.exercises||[])) {
      for (const s of (ex.sets||[])) {
        const r = (s.rir === '4+') ? 4 : (s.rir == null ? null : Number(s.rir));
        if (r == null || !isFinite(r)) continue;
        const w=(byWeek[l.week]=byWeek[l.week]||{sum:0,n:0,target});
        w.sum += (r - target); w.n++;
      }
    }
  }
  const weeks = Object.keys(byWeek).map(Number).sort((a,b)=>a-b);
  if (!weeks.length) return null;
  const rows = weeks.map(w => ({ week:w, drift:+(byWeek[w].sum/byWeek[w].n).toFixed(2), n:byWeek[w].n, target:byWeek[w].target }));
  const recent = rows.slice(-4);
  const avg = +(recent.reduce((s,r)=>s+r.drift,0)/recent.length).toFixed(2);
  return { rows, avg };
}

// ---- BP vs training load ----
// Assigns each BP reading to a training week by date range, then pairs weekly mean systolic
// against weekly volume-load. On an enhanced protocol BP is the health marker most likely to
// drift with training load, and nothing else in the app connects the two.
function computeBpLoad(logs, bpLog, block) {
  const wk = {};
  for (const l of logs) {
    if ((l.block||1) !== block) continue;
    const t = new Date(l.date).getTime();
    if (isNaN(t)) continue;
    const w = (wk[l.week] = wk[l.week] || { week:l.week, vol:0, min:t, max:t, sys:[], n:0 });
    w.vol += sessionVol(l);
    if (t < w.min) w.min = t;
    if (t > w.max) w.max = t;
  }
  const weeks = Object.values(wk);
  if (weeks.length < 3) return null;
  const DAY = 86400000;
  for (const b of (bpLog||[])) {
    const t = new Date(b.date).getTime();
    if (isNaN(t) || b.sys == null) continue;
    // pad the window by a day either side so a rest-day reading still lands in its week
    const hit = weeks.find(w => t >= w.min - DAY && t <= w.max + DAY);
    if (hit) { hit.sys.push(b.sys); hit.n++; }
  }
  const rows = weeks.filter(w => w.n > 0)
    .map(w => ({ week:w.week, vol:Math.round(w.vol), sys:Math.round(w.sys.reduce((a,b)=>a+b,0)/w.sys.length), n:w.n }))
    .sort((a,b)=>a.week-b.week);
  if (rows.length < 3) return null;
  // Pearson r between weekly volume-load and weekly mean systolic
  const n = rows.length;
  const mx = rows.reduce((s,r)=>s+r.vol,0)/n, my = rows.reduce((s,r)=>s+r.sys,0)/n;
  let num=0, dx=0, dy=0;
  for (const r of rows) { const a=r.vol-mx, b=r.sys-my; num+=a*b; dx+=a*a; dy+=b*b; }
  const r = (dx>0 && dy>0) ? +(num/Math.sqrt(dx*dy)).toFixed(2) : null;
  return { rows, r, weeks:n };
}

// ---- WHOOP burn cross-check ----
// Compares WHOOP's measured daily expenditure (COMPLETED cycles only) against the empirical
// maintenance derived from intake vs weight trend. Agreement raises confidence in both; a
// large gap means one of them is wrong and the empirical figure should be trusted.
function computeBurnCheck(whoopHistory, tdee) {
  if (!tdee) return null;
  const finals = (whoopHistory||[]).filter(h => h.dayCalFinal && h.dayCal > 0).slice(-14);
  if (finals.length < 5) return null;
  const avg = Math.round(finals.reduce((s,h)=>s+h.dayCal,0)/finals.length);
  const gap = avg - tdee;
  return { avg, tdee, gap, days: finals.length, agree: Math.abs(gap) <= 250 };
}

const CORE_EX = {
  upperA: new Set(['ua1','ua2','ua3']),
  lowerA: new Set(['la1','la3']),
  upperB: new Set(['ub2','ub1','ub9']),
  lowerB: new Set(['lb2','lb5']),
};

function mergeLogs(a, b) {
  const map = new Map(); const order = [];
  // Key on the immutable id (falling back to a deterministic legacy id). Keying on
  // date|sessionId meant an edit that changed either field created a phantom second
  // workout instead of being recognised as the same record.
  for (const l of [...(a || []), ...(b || [])]) {
    if (!l || !l.date) continue;
    const key = l.id || legacyId(l, 'wk');
    if (map.has(key)) { map.set(key, pickNewer(map.get(key), l)); }
    else { map.set(key, l); order.push(key); }
  }
  const out = order.map(k => map.get(k));
  out.sort((x, y) => x.date < y.date ? 1 : -1);
  return out.slice(0, 200);
}
// LAST-WRITE-WINS merge. The old implementation was first-wins over [...local, ...cloud],
// so the LOCAL copy always beat the cloud copy even when the cloud held a newer edit —
// the newer edit was discarded and then overwritten on the next push. Records now carry
// updatedAt (stamped on save); when both sides hold the same key we keep the newer one.
// ---- Record identity & sync schema ----
// Records need an IMMUTABLE id. Merge keys previously embedded the mutable value
// (date|weight, date|sys|dia ...), so editing a value produced a DIFFERENT key,
// pickNewer() never fired, and both the old and edited record survived as duplicates.
function newId() {
  try { if (typeof crypto !== 'undefined' && crypto.randomUUID) return crypto.randomUUID(); } catch(e){}
  return 'r' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
}
// Deterministic legacy id so the SAME pre-migration record gets the SAME id on every
// device — otherwise migration itself would create cross-device duplicates.
function legacyId(e, kind, index) {
  // Must distinguish MULTIPLE same-day records (two BP readings on one date previously
  // hashed identically and mergeByKey then discarded one as a duplicate version).
  const parts = [kind, e.date||'', e.site||'', e.compound||'', e.modality||'', e.sessionId||'',
                 e.sys ?? '', e.dia ?? '', e.pulse ?? '', e.value ?? '', e.weight ?? '',
                 e.dose ?? '', e.minutes ?? '', e.calories ?? '', index != null ? index : ''];
  const s = parts.join('|');
  let hh = 5381;
  for (let i = 0; i < s.length; i++) { hh = ((hh << 5) + hh + s.charCodeAt(i)) >>> 0; }
  return 'lg_' + kind + '_' + hh.toString(36);
}
function ensureIds(arr, kind) {
  if (!Array.isArray(arr)) return arr;
  let changed = false;
  const out = arr.map((e, i) => {
    if (!e || e.id) return e;
    changed = true;
    return { ...e, id: legacyId(e, kind, i), updatedAt: e.updatedAt != null ? e.updatedAt : 0 };
  });
  return changed ? out : arr;
}
function live(arr) { return (arr || []).filter(e => e && !e.deletedAt); }
function pruneTombstones(arr, days) {
  const cut = Date.now() - (days || 90) * 86400000;
  return (arr || []).filter(e => !e.deletedAt || e.deletedAt > cut);
}
function pickNewer(x, y) {
  const tx = x && x.updatedAt != null ? x.updatedAt : 0;
  const ty = y && y.updatedAt != null ? y.updatedAt : 0;
  return ty > tx ? y : x;   // ties keep the incumbent (local) — deterministic
}
function mergeByKey(a, b, keyFn) {
  const map = new Map(); const order = [];
  for (const e of [...(a || []), ...(b || [])]) {
    if (!e) continue;
    const k = keyFn(e);
    if (map.has(k)) { map.set(k, pickNewer(map.get(k), e)); }
    else { map.set(k, e); order.push(k); }
  }
  // Tombstones (deletedAt) are RETAINED here so they propagate to other devices via the
  // synced snapshot; the UI filters them out via live(). A newer tombstone beats an older
  // live record through pickNewer(), which is what stops a delete being resurrected.
  const out = order.map(k => map.get(k));
  out.sort((x, y) => (x.date || '') < (y.date || '') ? 1 : -1);
  return out;
}

const MEAS_SITES = ['Waist','Chest','Shoulders','Neck','Hips','Left Arm','Right Arm','Left Forearm','Right Forearm','Left Thigh','Right Thigh','Left Calf','Right Calf'];

function computeReadiness(recovery, whoopData, deloadInfo, logs, week, whoopHistory, latestBP, deloadActive, ctxReasons) {
  const lastLog = logs && logs[0];
  // Pain only counts if it is recent. Previously a sharp-pain flag from the last logged
  // workout capped readiness indefinitely, even after months away.
  const _painAge = lastLog && lastLog.date ? (Date.now() - new Date(lastLog.date).getTime())/86400000 : null;
  const painFresh = _painAge != null && _painAge >= 0 && _painAge <= 14;  // >=0 rejects future-dated logs
  const recentPain = painFresh ? (lastLog?.exercises || []).filter(e => e.pain).map(e => ({ name: e.name, level: e.pain })) : [];
  const sharpPain = recentPain.some(p => p.level === 2);
  const nigglePain = recentPain.some(p => p.level === 1);
  const sharpName = recentPain.find(p => p.level === 2)?.name;
  // WHOOP freshness: cached recovery must not gate today. BP already had this guard;
  // WHOOP did not, so a stale green score could still trigger green_push / high volume.
  const whoopAgeH = whoopData?.cachedAt ? (Date.now() - whoopData.cachedAt)/3600000 : null;
  const whoopStale = whoopAgeH != null && whoopAgeH > 30; // >~1 day old
  const rec = whoopStale ? null : whoopData?.recovery;
  const recLow = rec != null && rec < 34;
  const recMidLow = rec != null && rec >= 34 && rec < 50;
  const recHigh = rec != null && rec >= 67;
  const sleep = whoopStale ? null : whoopData?.sleep;
  const sleepPoor = sleep != null && sleep < 70;
  const sleepGreat = sleep != null && sleep >= 85;
  const subjBeat = recovery === 'beat';
  const subjExcellent = recovery === 'excellent';
  const trend = deloadInfo?.level;
  const deloadWk = deloadActive != null ? deloadActive : [4, 8, 12].includes(week);
  const peakWk = [9, 10, 11].includes(week);

  const factors = [];
  let major = 0, minor = 0, pos = 0;
  if (subjBeat) { major++; factors.push('you flagged feeling beat up'); }
  // Attribution: a dip that follows alcohol, illness or a bad night is transient and is NOT
  // accumulated training fatigue. Name the cause and don't let the TREND signal escalate on
  // it. Today's raw low recovery still counts — you still train easier today, you just don't
  // get told to deload for it.
  const ctxAttributed = !!(ctxReasons && ctxReasons.length);
  if (ctxAttributed) factors.push('recent ' + ctxReasons.join(', ') + ' — likely transient, not training fatigue');
  if (recLow) { major++; factors.push('WHOOP recovery red (' + rec + '%)'); }
  if (trend === 'deload' && !ctxAttributed) { major++; factors.push('fatigue trend building'); }
  if (sleepPoor && !ctxAttributed) { minor++; factors.push('poor sleep (' + sleep + '%)'); }
  if (trend === 'moderate' && !ctxAttributed) { minor++; factors.push('early fatigue signal'); }
  if (nigglePain) { minor++; factors.push('joint niggle flagged last session'); }
  if (recMidLow) { minor++; factors.push('WHOOP recovery low-yellow (' + rec + '%)'); }
  if (subjExcellent) { pos++; factors.push('you feel fresh'); }
  if (recHigh) { pos++; factors.push('WHOOP recovery green (' + rec + '%)'); }
  if (trend === 'fresh') pos++;
  if (sleepGreat) { pos++; factors.push('strong sleep (' + sleep + '%)'); }

  // Cumulative-fatigue + illness signals from the richer WHOOP feed
  const sd = whoopStale ? null : whoopData?.sleepDebt;
  if (sd != null && sd >= 2) { minor++; factors.push('sleep debt ' + sd + 'h'); }
  const rrVals = (whoopHistory || []).map(h => h.respRate).filter(v => v != null);
  if (!whoopStale && whoopData?.respRate != null && rrVals.length >= 5) {
    const baseArr = rrVals.slice(0, -1).slice(-14);
    const baseAvg = baseArr.reduce((a, b) => a + b, 0) / baseArr.length;
    if (whoopData.respRate >= baseAvg + 1) { major++; factors.push('respiratory rate up vs baseline (possible illness)'); }
  }

  const ORDER = ['red_stop', 'red_min', 'amber', 'green_standard', 'green_push'];
  let mode;
  if (deloadWk) mode = 'amber';
  else if (major >= 3 || (sharpPain && major >= 2)) mode = 'red_stop';
  else if (major >= 2) mode = 'red_min';
  else if (major === 1 || minor >= 2) mode = 'amber';
  else if (pos >= 2) mode = 'green_push';
  else mode = 'green_standard';
  if (sharpPain && ORDER.indexOf(mode) > ORDER.indexOf('amber')) mode = 'amber';
  if (peakWk && mode === 'green_standard' && pos >= 1 && major === 0 && !sharpPain) mode = 'green_push';

  // BP hard-gate: a raised MORNING reading caps readiness regardless of recovery (mirrors autoreg gate).
  // Only valid on a same-day reading — BP varies daily, so a stale reading must not gate today's call.
  // Stage 2 / Crisis (>=140/90) -> minimum dose. Stage 1 / Elevated (>=120) -> no grinders.
  if (latestBP) {
    const bpc = bpCategory(latestBP.sys, latestBP.dia);
    const bpAgeDays = (Date.now() - new Date(latestBP.date).getTime()) / 86400000;
    const bpFresh = bpAgeDays <= 1.0;   // reading from today (or last ~24h) only
    if (bpFresh && bpc.cls === 'red' && ORDER.indexOf(mode) > ORDER.indexOf('red_min')) {
      mode = 'red_min'; factors.push('blood pressure ' + latestBP.sys + '/' + latestBP.dia + ' (' + bpc.label + ')');
    } else if (bpFresh && bpc.cls === 'amber' && ORDER.indexOf(mode) > ORDER.indexOf('amber')) {
      mode = 'amber'; factors.push('blood pressure ' + latestBP.sys + '/' + latestBP.dia + ' (' + bpc.label + ')');
    } else if (!bpFresh && (bpc.cls === 'red' || bpc.cls === 'amber')) {
      // stale elevated reading: inform, do not gate — prompt a fresh measurement
      factors.push('last BP ' + latestBP.sys + '/' + latestBP.dia + ' (' + bpc.label + ') was ' + Math.round(bpAgeDays) + 'd ago \u2014 measure again today');
    }
  }

  const META = {
    green_push:     { title: 'Green \u00b7 Push',        cls: 'green', action: 'Full session. Push your top sets and add load wherever your targets call for it. Intensifiers on if this week programmes them.' },
    green_standard: { title: 'Green \u00b7 Standard',    cls: 'green', action: 'Full session as planned. Hit your targets with honest reps in reserve, no extra volume.' },
    amber:          { title: 'Amber \u00b7 Modify',      cls: 'amber', action: deloadWk ? 'Deload week. Keep the main lifts light, cut accessory volume, and stay well short of failure.' : 'Train, but modify. Keep your main compounds, trim one or two isolation sets, and stay a rep or two shy of failure.' },
    red_min:        { title: 'Red \u00b7 Minimum Dose',  cls: 'red',   action: 'Minimum effective dose. Run the 30-minute version, skip intensifiers, leave 2-3 in reserve, and chase a pump rather than a PR.' },
    red_stop:       { title: 'Red \u00b7 Recover',       cls: 'red',   action: "Back off today. Mobility, a walk, or easy cardio, or just rest. This mix of signals isn't the day to grind." },
  };
  const meta = META[mode];
  let action = meta.action;
  if (sharpPain && sharpName && mode === 'amber') action += ' Swap ' + sharpName + ' for a joint-friendly alternative.';
  return { mode, cls: meta.cls, title: meta.title, action, factors };
}

function bpCategory(sys, dia) {
  if (sys >= 180 || dia >= 120) return { label: 'Crisis - seek care', cls: 'red' };
  if (sys >= 140 || dia >= 90) return { label: 'High (Stage 2)', cls: 'red' };
  if (sys >= 130 || dia >= 80) return { label: 'High (Stage 1)', cls: 'amber' };
  if (sys >= 120) return { label: 'Elevated', cls: 'amber' };
  return { label: 'Normal', cls: 'green' };
}

function glucoseCategory(g) {
  // Fasting glucose in mmol/L. Thresholds: normal <5.6, impaired/watch 5.6-6.9, high >=7.0
  if (g >= 7.0) return { label: 'High - review', cls: 'red' };
  if (g >= 5.6) return { label: 'Watch (impaired fasting)', cls: 'amber' };
  if (g < 3.9) return { label: 'Low', cls: 'amber' };
  return { label: 'Normal', cls: 'green' };
}

      r.recovery = Math.round(s.recovery_score ?? 0) || null;
      r.hrv      = Math.round(s.hrv_rmssd_milli ?? s.hrv ?? 0) || null;
      r.rhr      = Math.round(s.resting_heart_rate ?? 0) || null;
      r.spo2     = s.spo2_percentage != null ? Math.round(s.spo2_percentage*10)/10 : null;
      r.skinTemp = s.skin_temp_celsius != null ? Math.round(s.skin_temp_celsius*10)/10 : null;
    }
    // Sleep performance, stages, respiratory rate and sleep debt come from the sleep feed
    const sleep = data?.sleep?.records?.[0] || data?.sleep?.data?.[0];

      r.respRate = s.respiratory_rate != null ? Math.round(s.respiratory_rate*10)/10 : null;

      const sn = s.sleep_needed || {};
      const needed = (sn.baseline_milli||0) + (sn.need_from_sleep_debt_milli||0) + (sn.need_from_recent_strain_milli||0) + (sn.need_from_recent_nap_milli||0);
      if (needed > 0 && asleep > 0) r.sleepDebt = Math.max(0, Math.round((needed - asleep)/360000)/10);

    const cycle = data?.cycles?.records?.[0] || data?.cycles?.data?.[0];

  // score wrote 'excellent', it kept adding a positive readiness factor for days after the

  // WHOOP recovery reaches readiness properly via whoopData.recovery (freshness-gated).

      // Completed cycles carry TRUE full-day burns and overwrite any partial value already
      // stored for that date (mergeHistory is field-level, and these come last so they win).

    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        if (width > height && width > maxDim) { height = Math.round(height * maxDim / width); width = maxDim; }
        else if (height > maxDim) { width = Math.round(width * maxDim / height); height = maxDim; }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });

                </div>
              </div>
              <div className="ec-cues">{curEx.cues.map((c,i) => <span key={i} className="cue">{c}</span>)}</div>
              {activeInts.has(curEx.id) && curEx.int && (

              {curEx.avoidFail && <div className="avd-box">{curEx.avoidReason}</div>}
              <div className="set-trk">
                <div className="stl">
                  <span>{editIdx!==null?`Editing Set ${editIdx+1}`:`Set ${loggedSetsArr.length+1} of ${effSets}`}</span>
                  <span style={{color:'var(--t3)',fontFamily:'JetBrains Mono,monospace',fontSize:9}}>{loggedSetsArr.length}/{effSets} done</span>
                </div>
                <div className="dots">
                  {Array.from({length:effSets}).map((_,i) => (
                    <div key={i} className={`dot${i<loggedSetsArr.length?' d':i===loggedSetsArr.length&&editIdx===null?' c':''}`}/>
                  ))}
                </div>
              </div>
              {loggedSetsArr.length > 0 && (
                <div className="logged-sets">
                  {loggedSetsArr.map((s,i) => (
                    <div key={i} className={`ls-chip${editIdx===i?' ed':''}`}
