<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Diamond">
  <meta name="theme-color" content="#07090c">
  <meta name="description" content="Diamond Protocol 12-Week Hypertrophy Tracker">
  <title>Diamond Protocol</title>
  <link id="apple-icon" rel="apple-touch-icon" href="">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:#07090c;color:#dde5ee;font-family:'Syne',sans-serif;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
:root{--bg:#07090c;--sur:#0e1319;--crd:#141b22;--bdr:#1d2733;--acc:#c4ff00;--ag:rgba(196,255,0,.12);--ag2:rgba(196,255,0,.05);--ok:#00e87a;--warn:#ff8c00;--err:#ff4444;--inf:#4a9eff;--t:#dde5ee;--t2:#7b90a8;--t3:#3c4f62}
#root{height:100%;overflow:hidden}
.app{max-width:440px;margin:0 auto;height:100dvh;background:var(--bg);position:relative;overflow:hidden;display:flex;flex-direction:column}
.screen{flex:1;overflow-y:auto;padding-bottom:calc(80px + env(safe-area-inset-bottom,0));-webkit-overflow-scrolling:touch}
.fullscreen{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-top:env(safe-area-inset-top,0);padding-bottom:env(safe-area-inset-bottom,0)}
.topbar{position:sticky;top:0;z-index:20;background:var(--bg);display:flex;align-items:center;justify-content:space-between;padding:env(safe-area-inset-top, 16px) 16px 12px;padding-top:calc(env(safe-area-inset-top, 0px) + 16px);border-bottom:1px solid var(--bdr);flex-shrink:0}
.logo{font-size:11px;font-weight:800;letter-spacing:.35em;color:var(--acc);text-transform:uppercase}
.top-badge{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;background:var(--ag);border:1px solid var(--acc);color:var(--acc)}
.phase-bar{margin:11px 15px;padding:12px 14px;border-radius:10px;border:1px solid var(--bdr);background:var(--sur);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.phase-bar.deload{border-color:rgba(255,140,0,.45);background:rgba(255,140,0,.04)}
.phase-bar.peak{border-color:rgba(196,255,0,.45);background:var(--ag2)}
.ph-name{font-size:13px;font-weight:700}
.ph-sub{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--t2);margin-top:3px}
.rir-val{font-family:'JetBrains Mono',monospace;font-size:18px;font-weight:700;color:var(--acc)}
.wksel{display:flex;align-items:center;justify-content:center;gap:20px;padding:10px 16px 4px}
.wkb{width:40px;height:40px;background:var(--crd);border:1px solid var(--bdr);color:var(--t);border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:22px;transition:all .15s;font-family:inherit;flex-shrink:0}
.wkb:hover:not(:disabled){border-color:var(--acc);color:var(--acc)}
.wkb:disabled{opacity:.18;cursor:not-allowed}
.wknum{font-family:'JetBrains Mono',monospace;font-size:54px;font-weight:700;line-height:1;letter-spacing:-.03em;text-align:center}
.wksub{font-size:9px;letter-spacing:.22em;color:var(--t3);margin-top:2px;text-align:center;text-transform:uppercase}
.grid12{display:grid;grid-template-columns:repeat(12,1fr);gap:3px;padding:6px 15px 3px}
.wc{height:24px;border-radius:4px;background:var(--crd);border:1px solid var(--bdr);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s}
.wc.cur{border-color:var(--acc);background:var(--ag2)}
.wc.all{background:rgba(0,232,122,.12);border-color:rgba(0,232,122,.35)}
.wc.part{background:rgba(196,255,0,.04);border-color:rgba(196,255,0,.2)}
.wc.dl{border-color:rgba(255,140,0,.3)}
.wc-n{font-family:'JetBrains Mono',monospace;font-size:8px;font-weight:700;color:var(--t3)}
.wc.cur .wc-n{color:var(--acc)}
.wc.all .wc-n{color:var(--ok)}
.adv-banner{margin:0 15px 8px;padding:9px 13px;background:rgba(0,232,122,.05);border:1px solid rgba(0,232,122,.3);border-radius:8px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-shrink:0}
.adv-txt{font-size:11px;color:var(--ok);flex:1}
.adv-btn{font-family:'Syne',sans-serif;font-size:11px;font-weight:800;padding:5px 11px;background:var(--ok);color:#000;border:none;border-radius:6px;cursor:pointer;white-space:nowrap}
.rec-sec{padding:7px 15px 10px;flex-shrink:0}
.sec-lbl{font-size:9px;letter-spacing:.22em;color:var(--t3);margin-bottom:5px;text-transform:uppercase}
.rec-row{display:flex;gap:6px}
.rc{flex:1;padding:7px 4px;background:var(--crd);border:1px solid var(--bdr);border-radius:6px;color:var(--t2);font-size:10px;font-weight:700;cursor:pointer;text-align:center;transition:all .15s;font-family:'Syne',sans-serif}
.rc.ok{border-color:var(--ok);color:var(--ok);background:rgba(0,232,122,.06)}
.rc.nm{border-color:var(--acc);color:var(--acc);background:var(--ag)}
.rc.bt{border-color:var(--warn);color:var(--warn);background:rgba(255,140,0,.06)}
.info-banner{margin:0 15px 8px;padding:8px 12px;border-radius:8px;font-size:11px;display:flex;align-items:center;gap:7px;flex-shrink:0}
.info-banner.warn{background:rgba(255,140,0,.05);border:1px solid rgba(255,140,0,.3);color:var(--warn)}
.info-banner.err{background:rgba(255,68,68,.05);border:1px solid rgba(255,68,68,.3);color:var(--err)}
.resume-box{margin:0 15px 10px;padding:11px 13px;background:rgba(74,158,255,.05);border:1px solid rgba(74,158,255,.3);border-radius:9px;flex-shrink:0}
.rb-title{font-size:13px;font-weight:700;color:var(--inf);margin-bottom:3px}
.rb-sub{font-size:11px;color:var(--t2);margin-bottom:8px}
.rb-btns{display:flex;gap:8px}
.rb-btn{flex:1;padding:8px;border-radius:7px;font-family:'Syne',sans-serif;font-size:11px;font-weight:700;cursor:pointer;border:1px solid var(--bdr);transition:opacity .15s}
.rb-btn.p{background:var(--inf);color:#000;border-color:var(--inf)}
.rb-btn.g{background:none;color:var(--t2)}
.sg{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 15px 16px}
.sc{background:var(--crd);border:1px solid var(--bdr);border-radius:11px;padding:13px 12px;cursor:pointer;position:relative;overflow:hidden;transition:all .2s}
.sc::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--acc);opacity:0;transition:opacity .2s}
.sc:hover::before,.sc:active::before{opacity:1}
.sc.done{border-color:rgba(0,232,122,.3)}
.sc.done::before{opacity:1;background:var(--ok)}
.s-day{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--t3);letter-spacing:.08em;margin-bottom:4px;text-transform:uppercase}
.s-nm{font-size:17px;font-weight:800;margin-bottom:2px;letter-spacing:-.01em}
.s-foc{font-size:10px;color:var(--t2);line-height:1.4}
.s-time{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--acc);margin-top:8px}
.s-done{position:absolute;top:9px;right:9px;width:16px;height:16px;background:var(--ok);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#000}
.back-btn{display:flex;align-items:center;gap:6px;padding:calc(env(safe-area-inset-top,0px) + 11px) 15px 3px;min-height:44px;border:none;background:none;color:var(--t2);font-size:13px;font-weight:600;cursor:pointer;font-family:'Syne',sans-serif;transition:color .15s;flex-shrink:0}
.s-hdr{padding:5px 15px 13px;border-bottom:1px solid var(--bdr);flex-shrink:0}
.s-hdr-nm{font-size:25px;font-weight:800;letter-spacing:-.01em}
.s-hdr-foc{font-size:13px;color:var(--t2);margin-top:2px}
.s-hdr-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.mp{font-family:'JetBrains Mono',monospace;font-size:10px;background:var(--sur);border:1px solid var(--bdr);color:var(--t2);padding:3px 9px;border-radius:20px}
.mp.acc{color:var(--acc);border-color:rgba(196,255,0,.35);background:var(--ag2)}
.mp.warn{color:var(--warn);border-color:rgba(255,140,0,.35)}
.int-ctrl{display:flex;align-items:center;justify-content:space-between;padding:8px 15px;border-bottom:1px solid var(--bdr);background:var(--sur);flex-shrink:0}
.int-ctrl-lbl{font-size:11px;font-weight:700;color:var(--t2)}
.int-count{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;color:var(--acc)}
.int-count.full{color:var(--ok)}
.ex-list{padding:8px 15px}
.ex-row{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--bdr)}
.ex-row:last-child{border-bottom:none}
.ex-n{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--t3);min-width:20px;padding-top:1px}
.ex-body{flex:1}
.ex-nm{font-size:14px;font-weight:700;margin-bottom:4px}
.ex-nm.opt{color:var(--t2)}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font-family:'JetBrains Mono',monospace;font-size:10px;padding:2px 7px;border-radius:4px;background:var(--sur);border:1px solid var(--bdr);color:var(--t2)}
.chip.rir{color:var(--acc);border-color:rgba(196,255,0,.3);background:var(--ag2)}
.chip.avd{color:var(--err);border-color:rgba(255,68,68,.3);background:rgba(255,68,68,.05);margin-top:3px;display:inline-block}
.chip.dl{color:var(--warn);border-color:rgba(255,140,0,.3)}
.int-tog-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:5px}
.int-tog-desc{font-size:10px;color:var(--t2);flex:1;line-height:1.4}
.int-tog{font-family:'JetBrains Mono',monospace;font-size:9px;padding:3px 8px;border-radius:4px;border:1px solid rgba(196,255,0,.3);background:var(--ag2);color:var(--acc);cursor:pointer;transition:all .15s;white-space:nowrap;font-weight:700;letter-spacing:.06em}
.int-tog.on{background:var(--acc);color:#000;border-color:var(--acc)}
.int-tog:disabled{opacity:.3;cursor:not-allowed}
.start-btn{display:block;margin:2px 15px 16px;width:calc(100% - 30px);padding:14px;background:var(--acc);color:#000;font-family:'Syne',sans-serif;font-size:14px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;border:none;border-radius:10px;cursor:pointer;transition:all .15s;flex-shrink:0}
.prog-rec{margin:9px 15px 0;padding:9px 12px;border-radius:8px;font-size:11px;font-weight:600;display:flex;align-items:center;gap:7px;flex-shrink:0}
.prog-rec.inc{background:rgba(0,232,122,.07);border:1px solid rgba(0,232,122,.3);color:var(--ok)}
.prog-rec.beat{background:var(--ag2);border:1px solid rgba(196,255,0,.25);color:var(--acc)}
.prog-rec.keep{background:var(--sur);border:1px solid var(--bdr);color:var(--t2)}
.prog-rec.first{background:rgba(74,158,255,.06);border:1px solid rgba(74,158,255,.25);color:var(--inf)}
.wk-prog{height:2px;background:var(--bdr);flex-shrink:0}
.wk-prog-fill{height:100%;background:var(--acc);transition:width .5s ease}
.wk-top{display:flex;align-items:center;justify-content:space-between;padding:10px 15px;border-bottom:1px solid var(--bdr);background:var(--bg);flex-shrink:0}
.wk-sn{font-size:10px;font-weight:700;letter-spacing:.14em;color:var(--t2);text-transform:uppercase}
.wk-cnt{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--t3)}
.ex-card{margin:9px 15px;background:var(--crd);border:1px solid var(--bdr);border-radius:12px;overflow:hidden}
.ec-hdr{padding:11px 13px 8px;border-bottom:1px solid var(--bdr)}
.ec-nm{font-size:19px;font-weight:800;margin-bottom:5px;letter-spacing:-.01em}
.ec-meta{display:flex;flex-wrap:wrap;gap:4px}
.ec-cues{padding:7px 13px;border-bottom:1px solid var(--bdr);display:flex;flex-wrap:wrap;gap:4px}
.cue{font-size:10px;color:var(--t2);background:var(--sur);padding:2px 8px;border-radius:20px}
.int-box{margin:7px 13px;padding:8px 11px;background:var(--ag2);border:1px solid rgba(196,255,0,.2);border-radius:8px}
.int-lbl{font-family:'JetBrains Mono',monospace;font-size:9px;font-weight:700;color:var(--acc);letter-spacing:.14em;margin-bottom:2px;text-transform:uppercase}
.int-txt{font-size:12px;color:var(--t2)}
.avd-box{margin:5px 13px;padding:6px 10px;background:rgba(255,68,68,.04);border:1px solid rgba(255,68,68,.2);border-radius:7px;font-size:11px;color:rgba(255,68,68,.85)}
.set-trk{padding:9px 13px;border-bottom:1px solid var(--bdr)}
.stl{font-size:9px;letter-spacing:.18em;color:var(--t3);margin-bottom:6px;text-transform:uppercase;display:flex;align-items:center;justify-content:space-between}
.dots{display:flex;gap:5px}
.dot{flex:1;height:3px;border-radius:2px;background:var(--bdr);transition:all .25s}
.dot.d{background:var(--ok)}
.dot.c{background:var(--acc);box-shadow:0 0 5px var(--acc)}
.logged-sets{padding:6px 13px;border-bottom:1px solid var(--bdr);display:flex;flex-wrap:wrap;gap:4px;min-height:32px}
.ls-chip{font-family:'JetBrains Mono',monospace;font-size:10px;padding:3px 8px;background:var(--sur);border:1px solid var(--bdr);border-radius:5px;color:var(--t2);cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:4px}
.ls-chip.ed{border-color:var(--acc);background:var(--ag);color:var(--acc)}
.ls-rir{font-size:8px;color:var(--t3)}
.prev-sec{padding:6px 13px;border-bottom:1px solid var(--bdr)}
.prev-lbl{font-size:9px;letter-spacing:.15em;color:var(--t3);margin-bottom:3px;text-transform:uppercase}
.prev-item{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--t2);display:flex;gap:5px;margin-bottom:2px;align-items:center}
.prev-dt{color:var(--t3);min-width:55px;font-size:9px}
.prev-prog{color:var(--acc);font-size:9px}
.inp-sec{padding:10px 13px;border-bottom:1px solid var(--bdr)}
.inp-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.inp-grp{display:flex;flex-direction:column;gap:4px}
.inp-lbl{font-size:9px;letter-spacing:.2em;color:var(--t3);text-transform:uppercase}
.nw{display:flex;align-items:center;background:var(--sur);border:1px solid var(--bdr);border-radius:8px;height:48px;overflow:hidden;transition:border-color .15s}
.nw:focus-within{border-color:rgba(196,255,0,.4)}
.nb{width:40px;height:100%;background:none;border:none;color:var(--t2);cursor:pointer;font-size:20px;display:flex;align-items:center;justify-content:center;transition:color .15s;font-family:inherit}
.nb:hover{color:var(--acc)}
.ni{flex:1;background:none;border:none;color:var(--t);font-family:'JetBrains Mono',monospace;font-size:20px;font-weight:700;text-align:center;outline:none;width:0;-moz-appearance:textfield}
.ni::-webkit-outer-spin-button,.ni::-webkit-inner-spin-button{-webkit-appearance:none}
.rir-grp{display:flex;flex-direction:column;gap:4px}
.rir-row{display:flex;gap:4px}
.rirb{flex:1;height:48px;background:var(--sur);border:1px solid var(--bdr);border-radius:8px;color:var(--t2);font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:700;cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:center}
.rirb:hover{border-color:var(--acc);color:var(--acc)}
.rirb.on{background:var(--acc);color:#000;border-color:var(--acc)}
.log-area{padding:0 13px 10px}
.log-btn{display:block;width:100%;padding:13px;background:var(--acc);color:#000;font-family:'Syne',sans-serif;font-size:13px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;border:none;border-radius:8px;cursor:pointer;transition:all .15s}
.log-btn.upd{background:var(--inf)}
.onerm-box{margin:6px 13px 0;padding:7px 11px;background:rgba(74,158,255,.05);border:1px solid rgba(74,158,255,.2);border-radius:7px;display:flex;align-items:center;justify-content:space-between}
.orm-lbl{font-size:11px;color:var(--t2)}
.orm-val{font-family:'JetBrains Mono',monospace;font-size:16px;font-weight:700;color:var(--inf)}
.wk-nav{display:flex;gap:8px;padding:0 15px 16px;flex-shrink:0}
.wnb{flex:1;padding:11px;background:none;border:1px solid var(--bdr);color:var(--t2);font-family:'Syne',sans-serif;font-size:11px;font-weight:700;border-radius:8px;cursor:pointer;transition:all .15s}
.wnb.fin{color:var(--err)}
.wnb:disabled{opacity:.4;cursor:default}
.timer-ov{position:fixed;inset:0;background:rgba(7,9,12,.97);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:300}
.t-lbl{font-size:10px;letter-spacing:.3em;color:var(--t2);margin-bottom:18px;text-transform:uppercase}
.t-ring{position:relative;width:200px;height:200px}
.t-ring svg{transform:rotate(-90deg)}
.t-track{fill:none;stroke:var(--bdr);stroke-width:10}
.t-fill{fill:none;stroke:var(--acc);stroke-width:10;stroke-linecap:round;filter:drop-shadow(0 0 8px var(--acc));transition:stroke-dashoffset .08s linear}
.t-ctr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.t-secs{font-family:'JetBrains Mono',monospace;font-size:54px;font-weight:700;line-height:1;letter-spacing:-.03em}
.t-unit{font-size:9px;letter-spacing:.25em;color:var(--t2);margin-top:3px;text-transform:uppercase}
.t-msg{margin-top:18px;font-size:12px;color:var(--t2);text-align:center}
.t-skip{margin-top:16px;padding:11px 36px;background:var(--crd);border:1px solid var(--bdr);color:var(--t);font-family:'Syne',sans-serif;font-size:14px;font-weight:700;border-radius:8px;cursor:pointer;transition:all .15s;letter-spacing:.04em}
.t-skip:hover{border-color:var(--acc);color:var(--acc)}
.modal-ov{position:fixed;inset:0;background:rgba(7,9,12,.88);display:flex;align-items:center;justify-content:center;z-index:400;padding:20px}
.modal{background:var(--crd);border:1px solid var(--bdr);border-radius:14px;padding:22px;width:100%;max-width:360px}
.modal-title{font-size:18px;font-weight:800;margin-bottom:7px}
.modal-sub{font-size:13px;color:var(--t2);margin-bottom:18px;line-height:1.5}
.modal-btns{display:flex;gap:8px}
.mbt{flex:1;padding:12px;border-radius:8px;font-family:'Syne',sans-serif;font-size:12px;font-weight:700;cursor:pointer;border:1px solid var(--bdr);transition:opacity .15s}
.mbt:hover{opacity:.85}
.mbt.danger{background:rgba(255,68,68,.08);color:var(--err);border-color:rgba(255,68,68,.3)}
.mbt.ghost{background:none;color:var(--t2)}
.done-view{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100dvh;padding:calc(env(safe-area-inset-top,0px) + 30px) 20px calc(env(safe-area-inset-bottom,0px) + 30px);text-align:center;overflow-y:auto}
.done-icon{font-size:56px;margin-bottom:14px}
.done-title{font-size:28px;font-weight:800;letter-spacing:-.01em;margin-bottom:4px}
.done-sub{font-size:14px;color:var(--t2);margin-bottom:20px}
.done-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%;max-width:290px;margin-bottom:18px}
.done-stat{background:var(--crd);border:1px solid var(--bdr);border-radius:10px;padding:12px;text-align:center}
.dsv{font-family:'JetBrains Mono',monospace;font-size:26px;font-weight:700;color:var(--acc)}
.dsl{font-size:10px;color:var(--t2);margin-top:3px}
.done-orms{width:100%;max-width:290px;margin-bottom:18px}
.done-orms-lbl{font-size:9px;letter-spacing:.2em;color:var(--t3);margin-bottom:6px;text-transform:uppercase}
.done-orm-row{display:flex;align-items:center;justify-content:space-between;padding:7px 11px;background:var(--crd);border:1px solid var(--bdr);border-radius:8px;margin-bottom:4px}
.done-orm-nm{font-size:11px;font-weight:700}
.done-orm-val{font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:700;color:var(--inf)}
.done-home{padding:13px 36px;background:var(--acc);color:#000;font-family:'Syne',sans-serif;font-size:14px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;border:none;border-radius:10px;cursor:pointer}
.ex-sel-wrap{padding:11px 15px;border-bottom:1px solid var(--bdr);flex-shrink:0}

.readiness-card.amber{border-color:rgba(255,140,0,.4);background:rgba(255,140,0,.05)}

.readiness-card.green .rd-mode{color:var(--ok)}

.period-sec{padding:13px 15px;border-bottom:1px solid var(--bdr)}
.period-btns{display:flex;gap:8px;margin-top:9px}
.period-btn{flex:1;padding:11px 8px;border-radius:9px;border:1px solid var(--acc);background:var(--ag2);color:var(--acc);font-family:'Syne',sans-serif;font-weight:700;font-size:12px;cursor:pointer}

.bp-chip.amber{color:var(--warn);background:rgba(255,140,0,.12)}
.bp-chip.red{color:var(--err);background:rgba(255,68,68,.12)}
.bp-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.bp-dot.green{background:var(--ok)}
.bp-dot.amber{background:var(--warn)}
.bp-dot.red{background:var(--err)}

function calcPlates(target, bar=20) {

function weekMuscleVolume(logs, wk, block) {
  const v = {};
  for (const l of logs) {
    if (l.week !== wk) continue;
    if (block != null && (l.block||1) !== block) continue;
    for (const ex of (l.exercises || [])) {
      const m = EX_MUSCLE[ex.id]; if (!m) continue;
      const sets = ex.sets?.length || 0;
      v[m.p] = (v[m.p] || 0) + sets;
      if (m.s) v[m.s] = (v[m.s] || 0) + sets * 0.5;
    }
  }
  return v;

    if (!ex?.sets?.length) continue;
    const top = Math.max(...ex.sets.map(s => s.weight));
    if (ex.sets.every(s => s.reps >= rMax)) return {type:"inc", msg:`All sets hit ${rMax} reps — increase weight`, wt:top};
    if (ex.sets.some(s => s.reps >= rMax)) return {type:"beat", msg:"Beat weaker sets, keep weight", wt:top};
    return {type:"keep", msg:"Keep weight, beat reps", wt:top};
  }
  return {type:"first", msg:"First time — establish your working weight"};
}

function getPrevHist(exId, logs, limit=3) {
  const res = [];
  for (const s of logs) {
    const ex = s.exercises?.find(e => e.id === exId);
    if (ex?.sets?.length) { res.push({date:s.date, sets:ex.sets, week:s.week}); if(res.length>=limit) break; }
  }
  return res;
}

function getTarget(ex, logs, week) {
  const prev = getPrevHist(ex.id, logs, 1)[0];
  if (!prev) return { weight: 0, reps: ex.rMin, note: 'First time — establish a working weight', first: true };
  const topWeight = Math.max(...prev.sets.map(s => s.weight));
  const rec = getProgRec(ex.id, ex.rMax, logs);
  const incr = 2.5;
  if (DLW.has(week)) {
    return { weight: Math.round((topWeight * 0.85) / 2.5) * 2.5, reps: Math.round((ex.rMin + ex.rMax) / 2), note: 'Deload — keep several reps in reserve' };
  }
  if (rec.type === 'inc') {
    return { weight: topWeight + incr, reps: ex.rMin, note: 'Up ' + incr + 'kg — you hit top reps last time' };
  }
  return { weight: topWeight, reps: ex.rMax, note: 'Same weight — beat last session\'s reps' };
}

function playChime() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    [[880,0],[1100,.15],[1320,.3]].forEach(([freq,delay]) => {
      const o=ctx.createOscillator(), g=ctx.createGain();
      o.connect(g); g.connect(ctx.destination); o.frequency.value=freq; o.type='sine';
      g.gain.setValueAtTime(0, ctx.currentTime+delay);
      g.gain.linearRampToValueAtTime(.18, ctx.currentTime+delay+.05);
      g.gain.exponentialRampToValueAtTime(.001, ctx.currentTime+delay+.45);
      o.start(ctx.currentTime+delay); o.stop(ctx.currentTime+delay+.5);
    });
  } catch(e) {}
}

function SVGChart({ data, color='#c4ff00', height=130 }) {
  if (!data || data.length < 2) return <div style={{height,display:'flex',alignItems:'center',justifyContent:'center',color:'var(--t3)',fontSize:12}}>Need more sessions to show chart</div>;
  const vals = data.map(d => d.y);
  const maxV = Math.max(...vals), minV = Math.min(...vals);
  const range = maxV - minV || 1;
  const W=320, H=height, PX=36, PY=14, iW=W-PX*2, iH=H-PY*2;
  const tx = i => PX + (i/(data.length-1))*iW;
  const ty = v => H-PY-((v-minV)/range)*iH;
  const pts = data.map((d,i) => [tx(i), ty(d.y)]);
  const line = pts.map((p,i) => `${i===0?'M':'L'}${p[0].toFixed(1)} ${p[1].toFixed(1)}`).join(' ');
  const area = line + ` L${pts[pts.length-1][0].toFixed(1)} ${H-PY} L${PX} ${H-PY} Z`;
  const yTicks = [0,0.5,1].map(t => ({v: minV+t*range, y: ty(minV+t*range)}));
  const step = Math.ceil(data.length/4);
  const xLabels = data.filter((_,i) => i===0 || i===data.length-1 || i%step===0);
  return (
    <svg viewBox={`0 0 ${W} ${H}`} style={{width:'100%',display:'block'}}>
      <defs>
        <linearGradient id="cg" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor={color} stopOpacity="0.22"/>
          <stop offset="100%" stopColor={color} stopOpacity="0"/>
        </linearGradient>
      </defs>
      {yTicks.map((t,i) => (
        <g key={i}>
          <line x1={PX} y1={t.y} x2={W-PX} y2={t.y} stroke="#1d2733" strokeWidth="1" strokeDasharray="3 3"/>
          <text x={PX-5} y={t.y+3} textAnchor="end" fontSize="9" fill="#3c4f62" fontFamily="JetBrains Mono">{Math.round(t.v)}</text>
        </g>
      ))}
      {xLabels.map((d,i) => {
        const idx = data.indexOf(d);
        return <text key={i} x={tx(idx)} y={H-2} textAnchor="middle" fontSize="9" fill="#3c4f62" fontFamily="JetBrains Mono">{d.x}</text>;
      })}
      <path d={area} fill="url(#cg)"/>
      <path d={line} fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>
      {pts.map((p,i) => <circle key={i} cx={p[0]} cy={p[1]} r="3" fill={color}/>)}
    </svg>
  );
}

function parseWhoopHistory(rec) {

      rhr: Math.round(s.resting_heart_rate ?? 0) || null,
    };
  }).filter(x => x && x.recovery != null);
}
function mergeHistory(a, b) {
  const map = {};
  [...(a || []), ...(b || [])].forEach(e => { if (e && e.date) map[e.date] = e; });
  return Object.values(map).sort((x, y) => x.date < y.date ? -1 : 1).slice(-60);
}
function computeDeloadReadiness(history, week) {
  if (!history || history.length < 6) return { level: 'unknown', msg: 'Need about a week of WHOOP data to assess fatigue.' };
  const sorted = [...history].sort((x, y) => x.date < y.date ? -1 : 1);
  const recent = sorted.slice(-7);
  const base = sorted.length >= 14 ? sorted.slice(-14, -7) : sorted.slice(0, -7);
  const avg = (arr, k) => { const v = arr.map(e => e[k]).filter(n => n != null); return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null; };
  const rRec = avg(recent, 'recovery'), bRec = avg(base, 'recovery');
  const rHrv = avg(recent, 'hrv'), bHrv = avg(base, 'hrv');
  let signals = 0; const reasons = [];
  if (rRec != null && bRec != null && (rRec - bRec) <= -8) { signals++; reasons.push('recovery down ' + Math.round(bRec - rRec) + ' pts'); }
  if (rHrv != null && bHrv != null && ((rHrv - bHrv) / bHrv * 100) <= -10) { signals++; reasons.push('HRV down ' + Math.round((bHrv - rHrv) / bHrv * 100) + '%'); }
  if (rRec != null && rRec < 40) { signals++; reasons.push('recovery sitting low'); }
  const endOfBlock = [3, 7, 11].includes(week);
  let level, msg;
  if (signals >= 2) { level = 'deload'; msg = 'Fatigue is accumulating (' + reasons.join(', ') + '). Consider a deload or cut volume 30-40% this week.'; }
  else if (signals === 1) { level = 'moderate'; msg = 'Early fatigue signal (' + reasons.join(', ') + '). Hold volume, prioritise sleep, and watch your performance.'; }
  else { level = 'fresh'; msg = endOfBlock ? 'Recovery is holding well — you could push one more hard week before deloading.' : 'Recovery is holding well — keep progressing as planned.'; }
  if (endOfBlock && level === 'moderate') { level = 'deload'; msg = 'End of an accumulation block and ' + reasons.join(', ') + ' — a deload is well timed now.'; }
  return { level, msg, rRec: rRec != null ? Math.round(rRec) : null, bRec: bRec != null ? Math.round(bRec) : null, rHrv: rHrv != null ? Math.round(rHrv) : null, bHrv: bHrv != null ? Math.round(bHrv) : null };
}

function parseWhoopWorkouts(raw) {
  const records = raw?.records || raw?.data || [];
  return records.map(w => {
    const s = w.score || w;
    return {
      start: w.start || w.during?.lower || null,
      end: w.end || w.during?.upper || w.start || null,
      strain: s.strain != null ? Math.round(s.strain * 10) / 10 : null,
      avgHr: s.average_heart_rate != null ? Math.round(s.average_heart_rate) : null,
      maxHr: s.max_heart_rate != null ? Math.round(s.max_heart_rate) : null,
      kcal: s.kilojoule != null ? Math.round(s.kilojoule / 4.184) : null,
    };
  }).filter(w => w.start && w.strain != null);
}
function matchWorkout(log, workouts) {
  if (!workouts || !workouts.length || !log.date) return null;
  const end = new Date(log.date).getTime();
  const start = end - (log.duration || 60) * 60000;
  let best = null, bestOv = 0;
  for (const w of workouts) {
    const ws = new Date(w.start).getTime(), we = new Date(w.end || w.start).getTime();
    const ov = Math.min(end, we) - Math.max(start, ws);
    if (ov > bestOv) { bestOv = ov; best = w; }
  }
  return bestOv > 5 * 60000 ? best : null;
}

function detectPlateaus(logs) {
  const byEx = {};
  for (const l of logs) {
    for (const ex of (l.exercises || [])) {
      if (!ex.sets?.length) continue;
      const best = Math.max(...ex.sets.map(s => epley(s.weight, s.reps)));
      (byEx[ex.id] = byEx[ex.id] || { name: ex.name, vals: [] }).vals.push(best);
    }
  }
  const stalled = [];
  for (const id in byEx) {
    const v = byEx[id].vals;
    if (v.length < 4) continue;
    const peak = Math.max(...v);
    let stuck = 0;
    for (const x of v) { if (x >= peak - 0.001) break; stuck++; }
    if (stuck >= 3) stalled.push({ name: byEx[id].name, sessions: stuck, lastE1rm: Math.round(v[0]), peakE1rm: Math.round(peak) });
  }
  return stalled.sort((a, b) => b.sessions - a.sessions);
}

function mergeLogs(a, b) {
  const seen = new Set(); const out = [];
  for (const l of [...(a || []), ...(b || [])]) {
    if (!l || !l.date) continue;
    const key = l.date + '|' + (l.sessionId || '');
    if (seen.has(key)) continue;
    seen.add(key); out.push(l);
  }
  out.sort((x, y) => x.date < y.date ? 1 : -1);
  return out.slice(0, 200);

function mergeByKey(a, b, keyFn) {
  const seen = new Set(); const out = [];
  for (const e of [...(a || []), ...(b || [])]) {
    if (!e) continue;
    const k = keyFn(e);
    if (seen.has(k)) continue;
    seen.add(k); out.push(e);

function computeReadiness(recovery, whoopData, deloadInfo, logs, week, whoopHistory) {
  const lastLog = logs && logs[0];
  const recentPain = (lastLog?.exercises || []).filter(e => e.pain).map(e => ({ name: e.name, level: e.pain }));
  const sharpPain = recentPain.some(p => p.level === 2);
  const nigglePain = recentPain.some(p => p.level === 1);
  const sharpName = recentPain.find(p => p.level === 2)?.name;
  const rec = whoopData?.recovery;
  const recLow = rec != null && rec < 34;
  const recHigh = rec != null && rec >= 67;
  const sleep = whoopData?.sleep;
  const sleepPoor = sleep != null && sleep < 70;
  const sleepGreat = sleep != null && sleep >= 85;
  const subjBeat = recovery === 'beat';
  const subjExcellent = recovery === 'excellent';
  const trend = deloadInfo?.level;
  const deloadWk = [4, 8, 12].includes(week);
  const peakWk = [9, 10, 11].includes(week);

  const factors = [];
  let major = 0, minor = 0, pos = 0;
  if (subjBeat) { major++; factors.push('you flagged feeling beat up'); }
  if (recLow) { major++; factors.push('WHOOP recovery red (' + rec + '%)'); }
  if (trend === 'deload') { major++; factors.push('fatigue trend building'); }
  if (sleepPoor) { minor++; factors.push('poor sleep (' + sleep + '%)'); }
  if (trend === 'moderate') { minor++; factors.push('early fatigue signal'); }
  if (nigglePain) { minor++; factors.push('joint niggle flagged last session'); }
  if (subjExcellent) { pos++; factors.push('you feel fresh'); }
  if (recHigh) { pos++; factors.push('WHOOP recovery green (' + rec + '%)'); }
  if (trend === 'fresh') pos++;
  if (sleepGreat) { pos++; factors.push('strong sleep (' + sleep + '%)'); }

  // Cumulative-fatigue + illness signals from the richer WHOOP feed
  const sd = whoopData?.sleepDebt;
  if (sd != null && sd >= 2) { minor++; factors.push('sleep debt ' + sd + 'h'); }
  const rrVals = (whoopHistory || []).map(h => h.respRate).filter(v => v != null);
  if (whoopData?.respRate != null && rrVals.length >= 5) {
    const baseArr = rrVals.slice(0, -1).slice(-14);
    const baseAvg = baseArr.reduce((a, b) => a + b, 0) / baseArr.length;
    if (whoopData.respRate >= baseAvg + 1) { major++; factors.push('respiratory rate up vs baseline (possible illness)'); }
  }

  const ORDER = ['red_stop', 'red_min', 'amber', 'green_standard', 'green_push'];
  let mode;
  if (deloadWk) mode = 'amber';
  else if (major >= 3 || (sharpPain && major >= 2)) mode = 'red_stop';
  else if (major >= 2) mode = 'red_min';
  else if (major === 1 || minor >= 2) mode = 'amber';
  else if (pos >= 2) mode = 'green_push';
  else mode = 'green_standard';
  if (sharpPain && ORDER.indexOf(mode) > ORDER.indexOf('amber')) mode = 'amber';
  if (peakWk && mode === 'green_standard' && pos >= 1 && major === 0 && !sharpPain) mode = 'green_push';

  const META = {
    green_push:     { title: 'Green \u00b7 Push',        cls: 'green', action: 'Full session. Push your top sets and add load wherever your targets call for it. Intensifiers on if this week programmes them.' },
    green_standard: { title: 'Green \u00b7 Standard',    cls: 'green', action: 'Full session as planned. Hit your targets with honest reps in reserve, no extra volume.' },
    amber:          { title: 'Amber \u00b7 Modify',      cls: 'amber', action: deloadWk ? 'Deload week. Keep the main lifts light, cut accessory volume, and stay well short of failure.' : 'Train, but modify. Keep your main compounds, trim one or two isolation sets, and stay a rep or two shy of failure.' },
    red_min:        { title: 'Red \u00b7 Minimum Dose',  cls: 'red',   action: 'Minimum effective dose. Run the 30-minute version, skip intensifiers, leave 2-3 in reserve, and chase a pump rather than a PR.' },
    red_stop:       { title: 'Red \u00b7 Recover',       cls: 'red',   action: "Back off today. Mobility, a walk, or easy cardio, or just rest. This mix of signals isn't the day to grind." },
  };
  const meta = META[mode];
  let action = meta.action;
  if (sharpPain && sharpName && mode === 'amber') action += ' Swap ' + sharpName + ' for a joint-friendly alternative.';
  return { mode, cls: meta.cls, title: meta.title, action, factors };
}

function bpCategory(sys, dia) {
  if (sys >= 180 || dia >= 120) return { label: 'Crisis - seek care', cls: 'red' };
  if (sys >= 140 || dia >= 90) return { label: 'High (Stage 2)', cls: 'red' };
  if (sys >= 130 || dia >= 80) return { label: 'High (Stage 1)', cls: 'amber' };
  if (sys >= 120) return { label: 'Elevated', cls: 'amber' };
  return { label: 'Normal', cls: 'green' };
}

    }

    if (sleep) {
      const s = sleep.score || sleep;
      r.sleep = Math.round(s.sleep_performance_percentage ?? s.sleep_efficiency_percentage ?? 0) || null;
      r.respRate = s.respiratory_rate != null ? Math.round(s.respiratory_rate*10)/10 : null;
      const ss = s.stage_summary || {};

      if (needed > 0 && asleep > 0) r.sleepDebt = Math.max(0, Math.round((needed - asleep)/360000)/10);

      const tokens = await res.json();
      if (tokens.access_token) {
        LS.set('whoop_access_token', tokens.access_token);
        if (tokens.refresh_token) LS.set('whoop_refresh_token', tokens.refresh_token);

  const disconnectWhoop = () => {
    ['whoop_access_token','whoop_refresh_token','whoop_expires_at','whoop_cache'].forEach(k => LS.del(k));

      const p = new URLSearchParams(hash.substring(1));
      const at = p.get('whoop_access_token'), rt = p.get('whoop_refresh_token'), ei = p.get('whoop_expires_in');
      if (at) {
        LS.set('whoop_access_token', at);

              ))}
              {cardioLog.length === 0 && <div className="empty-msg">No cardio logged yet.<br/>Log a session above.</div>}
            </div>
          </div>

          <div className="body-sec">
            <div className="body-ttl">Blood Pressure</div>
            <div className="body-sub">Track BP for cardiovascular health &#8212; your stack can raise it, so watch the trend</div>
            {latestBP && (() => { const c = bpCategory(latestBP.sys, latestBP.dia); return (
              <div className="bp-latest">
                <div className="bp-reading">{latestBP.sys}/{latestBP.dia}{latestBP.pulse ? <span className="bp-pulse"> &#183; {latestBP.pulse} bpm</span> : null}</div>
                <span className={`bp-chip ${c.cls}`}>{c.label}</span>
              </div>
            ); })()}
            {bpSeries.length > 1 && (
              <div style={{marginBottom:10}}>
                <div className="chart-lbl">Systolic &#8212; last {Math.min(bpLog.length,21)} readings</div>
                <SVGChart data={bpSeries} height={110} color="#ff6b6b"/>
              </div>
            )}
            <button className="add-toggle" onClick={() => setShowAddBP(v => !v)}>
              <span>Log a reading</span><span className="plus">{showAddBP ? '\u2212' : '+'}</span>
            </button>
            {showAddBP && (
              <div className="body-form">
                <div className="bf-row">
                  <div className="bf-grp"><div className="bf-lbl">Systolic</div><input className="bf-in" type="number" inputMode="numeric" placeholder="120" value={bpSys} onChange={e => setBpSys(e.target.value)}/></div>
                  <div className="bf-grp"><div className="bf-lbl">Diastolic</div><input className="bf-in" type="number" inputMode="numeric" placeholder="80" value={bpDia} onChange={e => setBpDia(e.target.value)}/></div>
                  <div className="bf-grp"><div className="bf-lbl">Pulse (opt)</div><input className="bf-in" type="number" inputMode="numeric" placeholder="60" value={bpPulse} onChange={e => setBpPulse(e.target.value)}/></div>
                </div>
                <button className="bf-save" onClick={addBP}>Save</button>
              </div>
            )}
            <div className="body-list">
              {bpLog.slice(0, 21).map((b, i) => { const c = bpCategory(b.sys, b.dia); return (
                <div key={i} className="bl-row">
                  <span className="bl-date">{fmtShort(b.date)}</span>
                  <span style={{flex:1,margin:'0 8px',color:'var(--t)',fontWeight:600,fontSize:12}}>{b.sys}/{b.dia}{b.pulse ? <span style={{color:'var(--t3)',fontWeight:400,fontSize:10}}> &#183; {b.pulse}bpm</span> : null}</span>
                  <span className={`bp-dot ${c.cls}`}></span>
                  <button className="bl-del" onClick={() => setBpLog(prev => prev.filter((_,j) => j !== i))}>&#215;</button>
                </div>
              ); })}
              {bpLog.length === 0 && <div className="empty-msg">No readings yet.<br/>Log your blood pressure above.</div>}
            </div>
          </div>

          <div className="body-sec">
            <div className="body-ttl">Protocol Log</div>
            <div className="body-sub">Track your protocol doses alongside training</div>
            <button className="add-toggle" onClick={()=>setShowAddProt(v=>!v)}>
              <span>Log a dose</span><span className="plus">{showAddProt?'−':'+'}</span>
            </button>
            {showAddProt&&(
              <div className="body-form">
                <div className="bf-row">
                  <div className="bf-grp">
                    <div className="bf-lbl">Compound</div>
                    <select className="bf-sel" value={pCmp} onChange={e=>setPCmp(e.target.value)}>
                      {['TRT','HCG','Compound A','Compound B','Other'].map(c=><option key={c} value={c}>{c}</option>)}
                    </select>
                  </div>
                  <div className="bf-grp">
                    <div className="bf-lbl">Dose</div>
                    <input className="bf-in" type="number" inputMode="decimal" placeholder="Amount" value={pDose} onChange={e=>setPDose(e.target.value)}/>
                  </div>
                  <div className="bf-grp" style={{maxWidth:64}}>
                    <div className="bf-lbl">Unit</div>
                    <select className="bf-sel" value={pUnit} onChange={e=>setPUnit(e.target.value)}>
                      {['mg','iu','mcg','ml'].map(u=><option key={u} value={u}>{u}</option>)}
                    </select>
                  </div>
                </div>
                <input className="bf-in" type="text" placeholder="Notes (optional)" value={pNote} onChange={e=>setPNote(e.target.value)} style={{marginTop:0}}/>
                <button className="bf-save" onClick={addProtocol}>Save</button>
              </div>
            )}
            <div className="body-list">
              {protocolLog.slice(0,40).map((p,i)=>(
                <div key={i} className="p-row">
                  <span className="p-date">{fmtShort(p.date)}</span>
                  <div className="p-body">
                    <div className="p-cmp">{p.compound}</div>
                    <div className="p-dose">{p.dose}{p.unit}</div>
                    {p.notes&&<div className="p-note">{p.notes}</div>}
                  </div>
                  <button className="p-del" onClick={()=>setProtocolLog(prev=>prev.filter((_,j)=>j!==i))}>&#215;</button>
                </div>
              ))}
              {protocolLog.length===0&&<div className="empty-msg">No entries yet — log your first dose above.</div>}
            </div>
          </div>
        </div>
      )}

      {view !== 'workout' && view !== 'complete' && (
        <div className="bnav">
          {[['home','&#127947;','Program'],['progress','&#128200;','Progress'],['history','&#128203;','History'],['body','&#9878;','Body'],['tools','&#128295;','Tools']].map(([v,icon,label]) => (
            <div key={v} className={`bn${view===v?' on':''}`} onClick={() => setView(v)}>
              <span className="bn-ic" dangerouslySetInnerHTML={{__html:icon}}/>
              <span className="bn-lb">{label}</span>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));

  </script>
</body>
</html>
